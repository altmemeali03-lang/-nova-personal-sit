<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فؤاد فون | اضغط واربح</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#050505;
    color:#fff;
}


/* =========================
   MAIN
========================= */

.page{
    width:100vw;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            #241010 0%,
            #0b0b0b 55%,
            #000 100%
        );
}


/* =========================
   FRAME
========================= */

.frame{
    position:relative;

    width:96vw;
    height:94vh;

    max-width:1550px;

    background:
        linear-gradient(
            135deg,
            #100000,
            #090909 45%,
            #130000
        );

    border:2px solid #444;

    box-shadow:
        0 0 0 3px #050505,
        0 0 45px rgba(255,0,0,.25);

    overflow:hidden;
}


/* إطار داخلي */

.frame:before{
    content:"";

    position:absolute;

    inset:12px;

    border:1px solid #333;

    pointer-events:none;

    z-index:30;
}


/* =========================
   RED CORNERS
========================= */

.corner{
    position:absolute;
    width:130px;
    height:5px;
    background:#ff1717;

    box-shadow:
        0 0 12px #ff0000;

    z-index:40;
}

.c1{
    top:22px;
    left:28px;
}

.c2{
    top:22px;
    right:28px;
}

.c3{
    bottom:22px;
    left:28px;
}

.c4{
    bottom:22px;
    right:28px;
}

.corner-v{
    position:absolute;

    width:5px;
    height:90px;

    background:#ff1717;

    box-shadow:
        0 0 12px #ff0000;

    z-index:40;
}

.cv1{
    top:22px;
    left:28px;
}

.cv2{
    top:22px;
    right:28px;
}

.cv3{
    bottom:22px;
    left:28px;
}

.cv4{
    bottom:22px;
    right:28px;
}


/* =========================
   CONTENT
========================= */

.content{
    position:relative;

    width:100%;
    height:100%;

    z-index:10;

    display:grid;

    grid-template-columns:
        280px
        minmax(500px,1fr)
        240px;

    align-items:center;

    gap:15px;

    padding:45px 60px;
}


/* =========================
   LEFT
========================= */

.left{
    height:100%;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;
}


/* =========================
   LOGO
========================= */

.top-logo{
    width:75px;
    height:75px;

    object-fit:contain;

    margin-bottom:10px;
}


/* =========================
   TITLE
========================= */

.title{
    font-size:52px;
    font-weight:900;

    color:#fff;

    text-shadow:
        0 4px 15px #000;
}

.red-line{
    width:80px;
    height:4px;

    margin:12px auto;

    background:#ed1111;

    box-shadow:
        0 0 12px #f00;
}

.subtitle{
    font-size:19px;
    font-weight:bold;

    line-height:1.7;
}

.red{
    color:#ff2929;
}

.exclusive{
    margin-top:5px;

    color:#ddd;

    font-size:15px;

    line-height:1.7;
}


/* =========================
   BUTTON
========================= */

.spin-button{
    margin-top:30px;

    width:210px;

    padding:15px;

    border:none;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #ff1717,
            #9e0000
        );

    color:white;

    font-family:inherit;

    font-size:21px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 8px 25px rgba(255,0,0,.35);

    transition:.2s;
}

.spin-button:hover{
    transform:translateY(-3px);

    box-shadow:
        0 12px 35px rgba(255,0,0,.55);
}

.spin-button:active{
    transform:scale(.95);
}

.spin-button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.arrow{
    display:block;
    font-size:24px;

    animation:arrow 1s infinite;
}

@keyframes arrow{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(5px);
    }
}


/* =========================
   CENTER
========================= */

.center{
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;
}


/* =========================
   WHEEL AREA
========================= */

.wheel-area{
    position:relative;

    width:min(48vw,600px);
    aspect-ratio:1;
}


/* =========================
   POINTER
========================= */

.pointer{
    position:absolute;

    z-index:100;

    top:-4px;
    left:50%;

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:25px solid transparent;
    border-right:25px solid transparent;

    border-top:65px solid #ff1111;

    filter:
        drop-shadow(
            0 4px 5px #000
        );
}

.pointer:after{
    content:"";

    position:absolute;

    left:-10px;
    top:-58px;

    width:20px;
    height:20px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 0 4px #111;
}


/* =========================
   OUTER GLOW
========================= */

.wheel-glow{
    position:absolute;

    inset:-12px;

    border-radius:50%;

    border:4px solid #ed1111;

    box-shadow:

        0 0 10px #f00,
        0 0 25px rgba(255,0,0,.8),
        0 0 55px rgba(255,0,0,.3);

    pointer-events:none;

    z-index:20;
}


/* =========================
   WHEEL
========================= */

.wheel{
    position:absolute;

    inset:0;

    border-radius:50%;

    overflow:hidden;

    border:
        8px solid #080808;

    background:#111;

    box-shadow:

        0 0 0 3px #777,
        0 15px 40px #000;

    transition:
        transform
        5.5s
        cubic-bezier(.12,.75,.12,1);

    z-index:5;
}


/* =========================
   10 SECTORS
========================= */

.sectors{
    position:absolute;

    inset:0;

    border-radius:50%;

    background:
        conic-gradient(
            #e50909 0deg 36deg,
            #151515 36deg 72deg,

            #e50909 72deg 108deg,
            #151515 108deg 144deg,

            #e50909 144deg 180deg,
            #151515 180deg 216deg,

            #e50909 216deg 252deg,
            #151515 252deg 288deg,

            #e50909 288deg 324deg,
            #151515 324deg 360deg
        );
}


/* خطوط القطاعات */

.sector-lines{
    position:absolute;

    inset:0;

    border-radius:50%;

    background:
        repeating-conic-gradient(
            from -18deg,
            transparent 0deg 35deg,
            rgba(255,255,255,.65) 35deg 36deg
        );

    z-index:2;
}


/* =========================
   PRIZE IMAGES
========================= */

.prize{
    position:absolute;

    width:36%;
    height:36%;

    left:32%;
    top:32%;

    z-index:8;

    transform-origin:center;
}


/*
   الصورة تكون باتجاه مركز الخانة
*/

.prize img{

    position:absolute;

    width:95px;
    height:95px;

    max-width:100%;

    object-fit:contain;

    left:50%;
    top:-82px;

    transform:
        translateX(-50%);

    filter:
        drop-shadow(
            0 5px 7px rgba(0,0,0,.95)
        );

    background:transparent;

    border-radius:10px;
}


/* =========================
   POSITIONS
========================= */

.p1{
    transform:rotate(0deg);
}

.p2{
    transform:rotate(36deg);
}

.p3{
    transform:rotate(72deg);
}

.p4{
    transform:rotate(108deg);
}

.p5{
    transform:rotate(144deg);
}

.p6{
    transform:rotate(180deg);
}

.p7{
    transform:rotate(216deg);
}

.p8{
    transform:rotate(252deg);
}

.p9{
    transform:rotate(288deg);
}

.p10{
    transform:rotate(324deg);
}


/* =========================
   CENTER LOGO
========================= */

.center-logo{

    position:absolute;

    z-index:50;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:145px;
    height:145px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #242424,
            #080808
        );

    border:
        5px solid #ff1515;

    box-shadow:

        0 0 0 5px #050505,
        0 0 25px rgba(255,0,0,.8);

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.center-logo img{

    width:88%;
    height:88%;

    object-fit:contain;
}


/* =========================
   RIGHT
========================= */

.right{

    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;
}


/* =========================
   RESULT
========================= */

.result-box{

    width:220px;

    min-height:220px;

    padding:25px 18px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            #171717,
            #070707
        );

    border:
        1px solid #444;

    border-top:
        4px solid #e00000;

    box-shadow:
        0 10px 35px rgba(0,0,0,.6);
}

.result-title{

    color:#aaa;

    font-size:15px;

    margin-bottom:15px;
}

.result{

    color:#ff2222;

    font-size:24px;

    font-weight:900;

    line-height:1.5;
}

.gift{
    font-size:55px;
    margin-bottom:12px;
}

.help{

    margin-top:15px;

    color:#bbb;

    font-size:12px;

    line-height:1.7;
}


/* =========================
   FOOTER
========================= */

.footer{

    position:absolute;

    z-index:60;

    bottom:17px;

    left:50%;

    transform:translateX(-50%);

    white-space:nowrap;

    font-size:12px;

    color:#ccc;
}

.footer span{
    color:#ff1818;
    font-weight:bold;
}


/* =========================
   WIN
========================= */

.winner{
    animation:
        winner .7s ease;
}

@keyframes winner{

    0%{
        transform:scale(1);
    }

    40%{
        transform:scale(1.03);
    }

    70%{
        transform:scale(.98);
    }

    100%{
        transform:scale(1);
    }
}


/* =========================
   TABLET
========================= */

@media(max-width:1150px){

    .content{

        grid-template-columns:
            230px
            minmax(430px,1fr)
            190px;

        padding:
            40px 45px;
    }

    .title{
        font-size:42px;
    }

    .subtitle{
        font-size:15px;
    }

    .exclusive{
        font-size:13px;
    }

    .wheel-area{
        width:min(47vw,500px);
    }

    .prize img{
        width:75px;
        height:75px;
        top:-67px;
    }

    .center-logo{
        width:120px;
        height:120px;
    }

    .result-box{
        width:180px;
        min-height:190px;
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .frame{

        width:100vw;
        height:100vh;

        border:none;
    }

    .content{

        display:flex;

        flex-direction:column;

        padding:
            18px 20px 10px;

        gap:0;
    }


    .left{

        height:auto;

        flex-shrink:0;
    }

    .top-logo{

        width:40px;
        height:40px;

        margin-bottom:2px;
    }

    .title{
        font-size:27px;
    }

    .red-line{
        width:55px;
        height:3px;
        margin:5px auto;
    }

    .subtitle{
        font-size:11px;
        line-height:1.5;
    }

    .exclusive{
        font-size:9px;
        margin-top:1px;
    }


    .spin-button{

        margin-top:8px;

        width:170px;

        padding:8px;

        font-size:16px;
    }

    .arrow{
        font-size:18px;
    }


    .center{

        width:100%;

        flex:1;

        min-height:0;
    }

    .wheel-area{

        width:
            min(
                68vh,
                88vw
            );
    }


    .prize img{

        width:
            clamp(
                55px,
                13vw,
                78px
            );

        height:
            clamp(
                55px,
                13vw,
                78px
            );

        top:
            clamp(
                -68px,
                -10vw,
                -55px
            );
    }


    .center-logo{

        width:82px;
        height:82px;

        border-width:4px;
    }


    .right{
        display:none;
    }


    .footer{

        bottom:7px;

        font-size:8px;
    }


    .corner{
        width:70px;
        height:3px;
    }

    .corner-v{
        width:3px;
        height:50px;
    }
}


/* =========================
   VERY SHORT MOBILE
========================= */

@media(
    max-width:700px
) and (
    max-height:650px
){

    .content{
        padding-top:10px;
    }

    .top-logo{
        width:30px;
        height:30px;
    }

    .title{
        font-size:22px;
    }

    .subtitle{
        font-size:9px;
    }

    .exclusive{
        font-size:8px;
    }

    .spin-button{
        margin-top:4px;
        padding:5px;
        font-size:13px;
    }

    .wheel-area{
        width:
            min(
                60vh,
                80vw
            );
    }

    .center-logo{
        width:68px;
        height:68px;
    }

    .prize img{
        width:48px;
        height:48px;
        top:-50px;
    }
}


/* =========================
   LANDSCAPE MOBILE
========================= */

@media(
    max-height:550px
) and (
    orientation:landscape
){

    .content{

        display:grid;

        grid-template-columns:
            220px
            1fr
            180px;

        padding:
            25px 45px;
    }

    .title{
        font-size:28px;
    }

    .subtitle{
        font-size:11px;
    }

    .exclusive{
        font-size:9px;
    }

    .spin-button{
        margin-top:7px;
        padding:7px;
        font-size:14px;
    }

    .wheel-area{
        width:
            min(
                72vh,
                44vw
            );
    }

    .center-logo{
        width:80px;
        height:80px;
    }

    .prize img{
        width:55px;
        height:55px;
        top:-55px;
    }

    .result-box{
        width:160px;
        min-height:150px;
    }

    .footer{
        font-size:8px;
    }
}

</style>
</head>


<body>

<script>

/* =========================
   SETTINGS
========================= */

const prizeImages = [

    "F_1.JPG",
    "F_2.JPG",
    "F_3.JPG",
    "F_4.JPG",
    "F_5.JPG",
    "F_6.JPG",
    "F_7.JPG",
    "F_8.JPG",
    "F_9.JPG",
    "F_10.JPG"

];


let currentRotation = 0;

let spinning = false;


/* =========================
   SPIN
========================= */

function spinWheel(){

    if(spinning){
        return;
    }

    spinning = true;


    const wheel =
        document.getElementById("wheel");

    const button =
        document.getElementById("spinButton");

    const result =
        document.getElementById("result");

    const wheelArea =
        document.getElementById("wheelArea");


    button.disabled = true;


    result.innerHTML =
        "الرولة تدور...";


    /*
       اختيار الجائزة
    */

    const selected =
        Math.floor(
            Math.random() *
            10
        );


    /*
       كل خانة 36 درجة
    */

    const sector = 36;


    /*
       نخلي منتصف الصورة
       مقابل السهم
    */

    const target =
        selected * sector + 18;


    /*
       7 دورات كاملة
    */

    const extra =
        360 * 7;


    const finalRotation =
        currentRotation +
        extra +
        (360 - target);


    currentRotation =
        finalRotation;


    wheel.style.transform =
        `rotate(${finalRotation}deg)`;


    /*
       النتيجة
    */

    setTimeout(function(){

        result.innerHTML =
            "🎉 مبروك!<br>الجائزة رقم " +
            (selected + 1);


        wheelArea.classList.add(
            "winner"
        );


        setTimeout(function(){

            wheelArea.classList.remove(
                "winner"
            );

        },700);


        spinning = false;

        button.disabled = false;

    },5600);

}


/* =========================
   PRELOAD
========================= */

window.addEventListener(
    "load",
    function(){

        prizeImages.forEach(
            function(src){

                const image =
                    new Image();

                image.src = src;

            }
        );

    }
);

</script>
