<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فؤاد فون | اضغط واربح</title>

<style>

/* ==================================================
   RESET
================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#eee8dc;
    color:#fff;
}


/* ==================================================
   COLORS
================================================== */

:root{
    --dark-red:#650b0b;
    --deep-red:#420505;
    --red:#7d1010;
    --red-light:#a81717;

    --black:#080808;
    --black-soft:#151111;

    --beige:#eee8dc;
    --beige-light:#f5f0e7;
}


/* ==================================================
   PAGE
================================================== */

.page{
    width:100vw;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            #f7f1e7 0%,
            #eee8dc 55%,
            #e3dacb 100%
        );
}


/* ==================================================
   FRAME
================================================== */

.frame{
    position:relative;

    width:96vw;
    height:94vh;

    max-width:1550px;

    background:
        linear-gradient(
            135deg,
            #160303,
            #090909 48%,
            #210505
        );

    border:2px solid #2c2020;

    box-shadow:
        0 0 0 3px #e5ddcf,
        0 15px 55px rgba(45,10,10,.35);

    overflow:hidden;
}


/* ==================================================
   INNER FRAME
================================================== */

.frame:before{
    content:"";

    position:absolute;

    inset:12px;

    border:1px solid #493838;

    pointer-events:none;

    z-index:30;
}


/* ==================================================
   CORNERS
================================================== */

.corner{
    position:absolute;

    width:130px;
    height:5px;

    background:#7d1010;

    box-shadow:
        0 0 12px rgba(125,16,16,.8);

    z-index:40;
}

.c1{
    top:22px;
    left:28px;
}

.c2{
    top:22px;
    right:28px;
}

.c3{
    bottom:22px;
    left:28px;
}

.c4{
    bottom:22px;
    right:28px;
}


.corner-v{
    position:absolute;

    width:5px;
    height:90px;

    background:#7d1010;

    box-shadow:
        0 0 12px rgba(125,16,16,.8);

    z-index:40;
}

.cv1{
    top:22px;
    left:28px;
}

.cv2{
    top:22px;
    right:28px;
}

.cv3{
    bottom:22px;
    left:28px;
}

.cv4{
    bottom:22px;
    right:28px;
}


/* ==================================================
   CONTENT
================================================== */

.content{
    position:relative;

    width:100%;
    height:100%;

    z-index:10;

    display:grid;

    grid-template-columns:
        280px
        minmax(500px,1fr)
        240px;

    align-items:center;

    gap:15px;

    padding:45px 60px;
}


/* ==================================================
   LEFT
================================================== */

.left{
    height:100%;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;
}


/* ==================================================
   TOP LOGO
================================================== */

.top-logo{
    width:75px;
    height:75px;

    object-fit:contain;

    margin-bottom:10px;
}


/* ==================================================
   TITLE
================================================== */

.title{
    font-size:52px;
    font-weight:900;

    color:#fff;

    text-shadow:
        0 4px 15px #000;
}

.red-line{
    width:80px;
    height:4px;

    margin:12px auto;

    background:#7d1010;

    box-shadow:
        0 0 12px rgba(125,16,16,.8);
}

.subtitle{
    font-size:19px;
    font-weight:bold;

    line-height:1.7;
}

.red{
    color:#a81717;
}

.exclusive{
    margin-top:5px;

    color:#ddd;

    font-size:15px;

    line-height:1.7;
}


/* ==================================================
   SPIN BUTTON
================================================== */

.spin-button{
    margin-top:30px;

    width:210px;

    padding:15px;

    border:none;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #8b1111,
            #4b0505
        );

    color:white;

    font-family:inherit;

    font-size:21px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 8px 25px rgba(70,0,0,.45);

    transition:.2s;
}

.spin-button:hover{
    transform:translateY(-3px);

    background:
        linear-gradient(
            135deg,
            #a81717,
            #5a0707
        );

    box-shadow:
        0 12px 35px rgba(90,0,0,.55);
}

.spin-button:active{
    transform:scale(.95);
}

.spin-button:disabled{
    opacity:.5;
    cursor:not-allowed;
}


/* ==================================================
   CENTER
================================================== */

.center{
    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;
}


/* ==================================================
   WHEEL AREA
================================================== */

.wheel-area{
    position:relative;

    width:min(48vw,600px);

    aspect-ratio:1;
}


/* ==================================================
   POINTER
================================================== */

.pointer{
    position:absolute;

    z-index:100;

    top:-4px;
    left:50%;

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:25px solid transparent;
    border-right:25px solid transparent;

    border-top:65px solid #7d1010;

    filter:
        drop-shadow(
            0 4px 5px #000
        );
}

.pointer:after{
    content:"";

    position:absolute;

    left:-10px;
    top:-58px;

    width:20px;
    height:20px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 0 4px #111;
}


/* ==================================================
   WHEEL GLOW
================================================== */

.wheel-glow{
    position:absolute;

    inset:-12px;

    border-radius:50%;

    border:4px solid #7d1010;

    box-shadow:

        0 0 10px rgba(125,16,16,.9),
        0 0 25px rgba(125,16,16,.65),
        0 0 55px rgba(125,16,16,.25);

    pointer-events:none;

    z-index:20;
}


/* ==================================================
   WHEEL
================================================== */

.wheel{
    position:absolute;

    inset:0;

    border-radius:50%;

    overflow:hidden;

    border:
        8px solid #080808;

    background:#111;

    box-shadow:

        0 0 0 3px #6b5b5b,
        0 15px 40px #000;

    transition:
        transform
        5.5s
        cubic-bezier(.12,.75,.12,1);

    z-index:5;
}


/* ==================================================
   SECTORS
================================================== */

.sectors{
    position:absolute;

    inset:0;

    border-radius:50%;

    background:
        conic-gradient(
            #7d1010 0deg 36deg,
            #111111 36deg 72deg,

            #7d1010 72deg 108deg,
            #111111 108deg 144deg,

            #7d1010 144deg 180deg,
            #111111 180deg 216deg,

            #7d1010 216deg 252deg,
            #111111 252deg 288deg,

            #7d1010 288deg 324deg,
            #111111 324deg 360deg
        );
}


/* ==================================================
   SECTOR LINES
================================================== */

.sector-lines{
    position:absolute;

    inset:0;

    border-radius:50%;

    background:
        repeating-conic-gradient(
            from -18deg,
            transparent 0deg 35deg,
            rgba(245,240,231,.7) 35deg 36deg
        );

    z-index:2;
}


/* ==================================================
   PRIZE CONTAINER
================================================== */

.prize{
    position:absolute;

    width:36%;
    height:36%;

    left:32%;
    top:32%;

    z-index:8;

    transform-origin:center;
}


/*
==================================================
   IMPORTANT

   كل صورة موجودة في منتصف القطاع.

   القطاع الأول = 18°
   الثاني = 54°
   الثالث = 90°
   وهكذا...
==================================================
*/

.p1{
    transform:rotate(18deg);
}

.p2{
    transform:rotate(54deg);
}

.p3{
    transform:rotate(90deg);
}

.p4{
    transform:rotate(126deg);
}

.p5{
    transform:rotate(162deg);
}

.p6{
    transform:rotate(198deg);
}

.p7{
    transform:rotate(234deg);
}

.p8{
    transform:rotate(270deg);
}

.p9{
    transform:rotate(306deg);
}

.p10{
    transform:rotate(342deg);
}


/* ==================================================
   PRIZE IMAGE
================================================== */

.prize img{

    position:absolute;

    width:120px;
    height:120px;

    max-width:none;

    object-fit:contain;

    left:50%;

    /*
       رفع الصور إلى الأعلى
    */

    top:-105px;

    transform:
        translateX(-50%);

    filter:
        drop-shadow(
            0 6px 8px rgba(0,0,0,.95)
        );

    background:transparent;

    border-radius:10px;
}


/* ==================================================
   CENTER LOGO
================================================== */

.center-logo{

    position:absolute;

    z-index:50;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:145px;
    height:145px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #242424,
            #080808
        );

    border:
        5px solid #7d1010;

    box-shadow:

        0 0 0 5px #050505,
        0 0 25px rgba(125,16,16,.75);

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.center-logo img{

    width:88%;
    height:88%;

    object-fit:contain;
}


/* ==================================================
   RIGHT
================================================== */

.right{
    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;
}


/* ==================================================
   RESULT BOX
================================================== */

.result-box{

    width:220px;

    min-height:285px;

    padding:20px 15px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            #181010,
            #070707
        );

    border:
        1px solid #4b3838;

    border-top:
        4px solid #7d1010;

    box-shadow:
        0 10px 35px rgba(0,0,0,.6);

    border-radius:8px;
}


/* ==================================================
   RESULT IMAGE
================================================== */

.result-image{

    width:125px;
    height:125px;

    object-fit:contain;

    margin-bottom:10px;

    display:none;

    filter:
        drop-shadow(
            0 7px 9px rgba(0,0,0,.9)
        );

    border-radius:12px;
}


/* ==================================================
   RESULT PLACEHOLDER
================================================== */

.result-placeholder{

    width:125px;
    height:125px;

    display:flex;

    align-items:center;
    justify-content:center;

    margin-bottom:10px;

    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            #2b2020,
            #0b0b0b
        );

    border:
        1px solid #493333;

    font-size:52px;
}


/* ==================================================
   RESULT TITLE
================================================== */

.result-title{

    color:#aaa;

    font-size:15px;

    margin-bottom:10px;
}


/* ==================================================
   RESULT TEXT
================================================== */

.result{

    color:#c21b1b;

    font-size:20px;

    font-weight:900;

    line-height:1.5;
}


/* ==================================================
   HELP
================================================== */

.help{

    margin-top:12px;

    color:#bbb;

    font-size:12px;

    line-height:1.7;
}


/* ==================================================
   FOOTER
================================================== */

.footer{

    position:absolute;

    z-index:60;

    bottom:17px;

    left:50%;

    transform:translateX(-50%);

    white-space:nowrap;

    font-size:12px;

    color:#ccc;
}

.footer span{
    color:#a81717;
    font-weight:bold;
}


/* ==================================================
   WIN ANIMATION
================================================== */

.winner{
    animation:
        winner .7s ease;
}

@keyframes winner{

    0%{
        transform:scale(1);
    }

    40%{
        transform:scale(1.03);
    }

    70%{
        transform:scale(.98);
    }

    100%{
        transform:scale(1);
    }
}


/* ==================================================
   RESULT ANIMATION
================================================== */

.result-box.win{
    animation:
        resultWin .6s ease;
}

@keyframes resultWin{

    0%{
        transform:scale(.92);
        opacity:.6;
    }

    60%{
        transform:scale(1.05);
        opacity:1;
    }

    100%{
        transform:scale(1);
    }
}


/* ==================================================
   TABLET
================================================== */

@media(max-width:1150px){

    .content{

        grid-template-columns:
            230px
            minmax(430px,1fr)
            190px;

        padding:
            40px 45px;
    }

    .title{
        font-size:42px;
    }

    .subtitle{
        font-size:15px;
    }

    .exclusive{
        font-size:13px;
    }

    .wheel-area{
        width:min(47vw,500px);
    }

    .prize img{
        width:95px;
        height:95px;
        top:-88px;
    }

    .center-logo{
        width:120px;
        height:120px;
    }

    .result-box{
        width:180px;
        min-height:245px;
    }

    .result-image,
    .result-placeholder{
        width:100px;
        height:100px;
    }
}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:700px){

    .frame{

        width:100vw;
        height:100vh;

        border:none;
    }

    .content{

        display:flex;

        flex-direction:column;

        padding:
            18px 20px 10px;

        gap:0;
    }


    .left{

        height:auto;

        flex-shrink:0;
    }


    .top-logo{

        width:40px;
        height:40px;

        margin-bottom:2px;
    }


    .title{
        font-size:27px;
    }


    .red-line{
        width:55px;
        height:3px;
        margin:5px auto;
    }


    .subtitle{
        font-size:11px;
        line-height:1.5;
    }


    .exclusive{
        font-size:9px;
        margin-top:1px;
    }


    .spin-button{

        margin-top:8px;

        width:170px;

        padding:8px;

        font-size:16px;
    }


    .center{

        width:100%;

        flex:1;

        min-height:0;
    }


    .wheel-area{

        width:
            min(
                68vh,
                88vw
            );
    }


    .prize img{

        width:
            clamp(
                65px,
                16vw,
                90px
            );

        height:
            clamp(
                65px,
                16vw,
                90px
            );

        top:
            clamp(
                -78px,
                -13vw,
                -62px
            );
    }


    .center-logo{

        width:82px;
        height:82px;

        border-width:4px;
    }


    .right{
        display:none;
    }


    .footer{

        bottom:7px;

        font-size:8px;
    }


    .corner{
        width:70px;
        height:3px;
    }


    .corner-v{
        width:3px;
        height:50px;
    }
}


/* ==================================================
   VERY SHORT MOBILE
================================================== */

@media(
    max-width:700px
) and (
    max-height:650px
){

    .content{
        padding-top:10px;
    }

    .top-logo{
        width:30px;
        height:30px;
    }

    .title{
        font-size:22px;
    }

    .subtitle{
        font-size:9px;
    }

    .exclusive{
        font-size:8px;
    }

    .spin-button{
        margin-top:4px;
        padding:5px;
        font-size:13px;
    }

    .wheel-area{
        width:
            min(
                60vh,
                80vw
            );
    }

    .center-logo{
        width:68px;
        height:68px;
    }

    .prize img{
        width:58px;
        height:58px;
        top:-60px;
    }
}


/* ==================================================
   LANDSCAPE MOBILE
================================================== */

@media(
    max-height:550px
) and (
    orientation:landscape
){

    .content{

        display:grid;

        grid-template-columns:
            220px
            1fr
            180px;

        padding:
            25px 45px;
    }

    .title{
        font-size:28px;
    }

    .subtitle{
        font-size:11px;
    }

    .exclusive{
        font-size:9px;
    }

    .spin-button{
        margin-top:7px;
        padding:7px;
        font-size:14px;
    }

    .wheel-area{
        width:
            min(
                72vh,
                44vw
            );
    }

    .center-logo{
        width:80px;
        height:80px;
    }

    .prize img{
        width:70px;
        height:70px;
        top:-70px;
    }

    .result-box{
        width:160px;
        min-height:210px;
    }

    .result-image,
    .result-placeholder{
        width:80px;
        height:80px;
    }

    .footer{
        font-size:8px;
    }
}

</style>
</head>

<script>

/* ==================================================
   PRIZE IMAGES
================================================== */

const prizeImages = [

    "F_1.JPG",
    "F_2.JPG",
    "F_3.JPG",
    "F_4.JPG",
    "F_5.JPG",
    "F_6.JPG",
    "F_7.JPG",
    "F_8.JPG",
    "F_9.JPG",
    "F_10.JPG"

];


/* ==================================================
   ROTATION
================================================== */

let currentRotation = 0;

let spinning = false;


/* ==================================================
   SPIN WHEEL
================================================== */

function spinWheel(){

    /*
       منع الضغط أثناء الدوران
    */

    if(spinning){
        return;
    }


    spinning = true;


    /* ==================================================
       ELEMENTS
    ================================================== */

    const wheel =
        document.getElementById("wheel");


    const button =
        document.getElementById("spinButton");


    const result =
        document.getElementById("result");


    const resultImage =
        document.getElementById("resultImage");


    const resultPlaceholder =
        document.getElementById("resultPlaceholder");


    const resultBox =
        document.getElementById("resultBox");


    const wheelArea =
        document.getElementById("wheelArea");


    /* ==================================================
       DISABLE BUTTON
    ================================================== */

    button.disabled = true;


    /* ==================================================
       RESET RESULT
    ================================================== */

    resultImage.style.display = "none";

    resultPlaceholder.style.display = "flex";


    result.innerHTML =
        "الرولة تدور...";


    resultBox.classList.remove("win");


    /* ==================================================
       CHOOSE PRIZE

       نفس الرقم سيتم استخدامه:
       - في الرولة
       - وفي صورة النتيجة

       وهذا هو المهم حتى ما يصير اختلاف.
    ================================================== */

    const selected =
        Math.floor(
            Math.random() *
            prizeImages.length
        );


    /* ==================================================
       SECTOR SIZE

       عندنا 10 جوائز
       360 ÷ 10 = 36 درجة
    ================================================== */

    const sector = 36;


    /* ==================================================
       CENTER OF SELECTED SECTOR

       الجائزة الأولى:
       18°

       الثانية:
       54°

       الثالثة:
       90°

       وهكذا...
    ================================================== */

    const target =
        selected * sector + 18;


    /* ==================================================
       NUMBER OF FULL SPINS
    ================================================== */

    const extra =
        360 * 7;


    /* ==================================================
       FINAL ROTATION

       نخلي منتصف الجائزة المختارة
       يجي بالضبط تحت المؤشر.
    ================================================== */

    const finalRotation =
        currentRotation +
        extra +
        (360 - target);


    /* ==================================================
       SAVE ROTATION
    ================================================== */

    currentRotation =
        finalRotation;


    /* ==================================================
       START SPIN
    ================================================== */

    wheel.style.transform =
        `rotate(${finalRotation}deg)`;


    /* ==================================================
       SHOW RESULT AFTER SPIN
    ================================================== */

    setTimeout(function(){


        /*
           IMPORTANT:

           نفس selected الذي اختارناه
           للرولة نستخدمه للنتيجة.

           لذلك:
           F_1 → F_1
           F_2 → F_2
           ...
           F_10 → F_10
        */


        resultImage.src =
            prizeImages[selected];


        resultImage.style.display =
            "block";


        resultPlaceholder.style.display =
            "none";


        /* ==================================================
           RESULT TEXT
        ================================================== */

        result.innerHTML =
            "🎉 مبروك!<br>" +
            "الجائزة رقم " +
            (selected + 1);


        /* ==================================================
           WIN ANIMATION
        ================================================== */

        wheelArea.classList.add(
            "winner"
        );


        resultBox.classList.add(
            "win"
        );


        setTimeout(function(){

            wheelArea.classList.remove(
                "winner"
            );

            resultBox.classList.remove(
                "win"
            );

        },700);


        /* ==================================================
           ENABLE BUTTON
        ================================================== */

        spinning = false;

        button.disabled = false;


    },5600);

}


/* ==================================================
   PRELOAD IMAGES
================================================== */

window.addEventListener(
    "load",
    function(){

        prizeImages.forEach(
            function(src){

                const image =
                    new Image();

                image.src = src;

            }
        );

    }
);

</script>

</body>
</html>
