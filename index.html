<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>فؤاد فون | اضغط واربح</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}


/* =====================================================
   FONT
===================================================== */

body{

    font-family:
        "Tajawal",
        "Arial",
        "Tahoma",
        sans-serif;

    color:#fff;

    background:#010305;
}


/* =====================================================
   COLORS
===================================================== */

:root{

    --blue:#062B55;

    --blue-light:#0A3F78;

    --blue-glow:#0B4F91;

    --gold:#D6A900;

    --gold-light:#F0C928;

    --black:#010305;

    --black-2:#05080c;

}


/* =====================================================
   PAGE
===================================================== */

.page{

    width:100vw;

    height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    background:

        radial-gradient(
            circle at center,
            #071522 0%,
            #03070b 52%,
            #010203 100%
        );
}


/* =====================================================
   FRAME
===================================================== */

.frame{

    position:relative;

    width:96vw;

    height:94vh;

    max-width:1550px;

    background:

        linear-gradient(
            135deg,
            #05080c,
            #020406 48%,
            #07101a
        );

    border:2px solid #102B46;

    box-shadow:

        0 0 0 3px #010203,

        0 0 45px
        rgba(6,43,85,.45);

    overflow:hidden;
}


/* =====================================================
   INNER FRAME
===================================================== */

.frame:before{

    content:"";

    position:absolute;

    inset:12px;

    border:1px solid #17334F;

    pointer-events:none;

    z-index:30;
}


/* =====================================================
   CORNERS
===================================================== */

.corner{

    position:absolute;

    width:130px;

    height:5px;

    background:var(--blue);

    box-shadow:

        0 0 10px var(--blue-glow),

        0 0 25px
        rgba(6,43,85,.8);

    z-index:40;
}

.c1{
    top:22px;
    left:28px;
}

.c2{
    top:22px;
    right:28px;
}

.c3{
    bottom:22px;
    left:28px;
}

.c4{
    bottom:22px;
    right:28px;
}


.corner-v{

    position:absolute;

    width:5px;

    height:90px;

    background:var(--blue);

    box-shadow:

        0 0 10px var(--blue-glow),

        0 0 25px
        rgba(6,43,85,.8);

    z-index:40;
}

.cv1{
    top:22px;
    left:28px;
}

.cv2{
    top:22px;
    right:28px;
}

.cv3{
    bottom:22px;
    left:28px;
}

.cv4{
    bottom:22px;
    right:28px;
}


/* =====================================================
   CONTENT
===================================================== */

.content{

    position:relative;

    width:100%;

    height:100%;

    z-index:10;

    display:grid;

    grid-template-columns:
        280px
        minmax(500px,1fr)
        240px;

    align-items:center;

    gap:15px;

    padding:45px 60px;
}


/* =====================================================
   LEFT
===================================================== */

.left{

    height:100%;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;
}


/* =====================================================
   LOGO
===================================================== */

.top-logo{

    width:75px;

    height:75px;

    object-fit:contain;

    margin-bottom:10px;
}


/* =====================================================
   TITLE
===================================================== */

.title{

    font-size:52px;

    font-weight:900;

    letter-spacing:-1px;

    color:#fff;

    text-shadow:
        0 4px 15px #000;
}


.red-line{

    width:80px;

    height:4px;

    margin:12px auto;

    background:var(--blue);

    box-shadow:
        0 0 12px var(--blue-glow);
}


.subtitle{

    font-size:19px;

    font-weight:700;

    line-height:1.7;
}


.red{

    color:var(--gold-light);

    text-shadow:
        0 0 8px
        rgba(214,169,0,.25);
}


.exclusive{

    margin-top:5px;

    color:#b8c2ce;

    font-size:15px;

    line-height:1.7;
}


/* =====================================================
   BUTTON
===================================================== */

.spin-button{

    margin-top:30px;

    width:210px;

    padding:16px;

    border:none;

    border-radius:10px;

    background:

        linear-gradient(
            135deg,
            #0A3F78,
            #062B55
        );

    color:white;

    font-family:inherit;

    font-size:21px;

    font-weight:900;

    cursor:pointer;

    box-shadow:

        0 8px 25px
        rgba(6,43,85,.65),

        0 0 20px
        rgba(6,43,85,.25);

    transition:.2s;
}


.spin-button:hover{

    transform:translateY(-3px);

    box-shadow:

        0 12px 35px
        rgba(6,43,85,.85);
}


.spin-button:active{

    transform:scale(.95);
}


.spin-button:disabled{

    opacity:.5;

    cursor:not-allowed;
}


/* =====================================================
   CENTER
===================================================== */

.center{

    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;
}


/* =====================================================
   WHEEL AREA
===================================================== */

.wheel-area{

    position:relative;

    width:min(48vw,600px);

    aspect-ratio:1;
}


/* =====================================================
   POINTER
===================================================== */

.pointer{

    position:absolute;

    z-index:100;

    top:-4px;

    left:50%;

    transform:
        translateX(-50%);

    width:0;

    height:0;

    border-left:
        25px solid transparent;

    border-right:
        25px solid transparent;

    border-top:
        65px solid var(--gold);

    filter:

        drop-shadow(
            0 4px 5px #000
        )

        drop-shadow(
            0 0 8px
            rgba(214,169,0,.7)
        );
}


.pointer:after{

    content:"";

    position:absolute;

    left:-10px;

    top:-58px;

    width:20px;

    height:20px;

    border-radius:50%;

    background:#fff;

    box-shadow:

        0 0 0 4px #050505,

        0 0 10px var(--gold);
}


/* =====================================================
   WHEEL GLOW
===================================================== */

.wheel-glow{

    position:absolute;

    inset:-12px;

    border-radius:50%;

    border:4px solid var(--blue);

    box-shadow:

        0 0 10px var(--blue-glow),

        0 0 25px
        rgba(6,43,85,.9),

        0 0 55px
        rgba(6,43,85,.45);

    pointer-events:none;

    z-index:20;
}


/* =====================================================
   WHEEL
===================================================== */

.wheel{

    position:absolute;

    inset:0;

    border-radius:50%;

    overflow:hidden;

    border:
        8px solid #010305;

    background:#05080c;

    box-shadow:

        0 0 0 3px #203A55,

        0 15px 40px #000,

        0 0 35px
        rgba(6,43,85,.35);

    transition:

        transform

        5.5s

        cubic-bezier(.12,.75,.12,1);

    z-index:5;
}


/* =====================================================
   WHEEL COLORS
===================================================== */

.sectors{

    position:absolute;

    inset:0;

    border-radius:50%;

    background:

        conic-gradient(

            var(--blue) 0deg 36deg,

            var(--gold) 36deg 72deg,

            var(--blue) 72deg 108deg,

            var(--gold) 108deg 144deg,

            var(--blue) 144deg 180deg,

            var(--gold) 180deg 216deg,

            var(--blue) 216deg 252deg,

            var(--gold) 252deg 288deg,

            var(--blue) 288deg 324deg,

            var(--gold) 324deg 360deg
        );
}


/* =====================================================
   SECTOR LINES
===================================================== */

.sector-lines{

    position:absolute;

    inset:0;

    border-radius:50%;

    background:

        repeating-conic-gradient(

            from -18deg,

            transparent 0deg 35deg,

            rgba(255,255,255,.65)
            35deg 36deg
        );

    z-index:2;
}


/* =====================================================
   PRIZES
===================================================== */

.prize{

    position:absolute;

    width:36%;

    height:36%;

    left:32%;

    top:32%;

    z-index:8;

    transform-origin:center;
}


/* =====================================================
   PRIZE IMAGE
   أكبر + أعلى
===================================================== */

.prize img{

    position:absolute;

    width:118px;

    height:118px;

    max-width:none;

    object-fit:contain;

    left:50%;

    top:-105px;

    transform:
        translateX(-50%);

    filter:

        drop-shadow(
            0 6px 8px
            rgba(0,0,0,.95)
        )

        drop-shadow(
            0 0 5px
            rgba(255,255,255,.12)
        );

    background:transparent;

    border-radius:10px;
}


/* =====================================================
   POSITIONS
===================================================== */

.p1{
    transform:rotate(0deg);
}

.p2{
    transform:rotate(36deg);
}

.p3{
    transform:rotate(72deg);
}

.p4{
    transform:rotate(108deg);
}

.p5{
    transform:rotate(144deg);
}

.p6{
    transform:rotate(180deg);
}

.p7{
    transform:rotate(216deg);
}

.p8{
    transform:rotate(252deg);
}

.p9{
    transform:rotate(288deg);
}

.p10{
    transform:rotate(324deg);
}


/* =====================================================
   SPECIAL TEXT
   F1 / F7 / F10
===================================================== */

.prize-text{

    position:absolute;

    width:170px;

    left:50%;

    top:-88px;

    transform:
        translateX(-50%);

    text-align:center;

    color:#fff;

    font-size:18px;

    font-weight:900;

    line-height:1.15;

    white-space:nowrap;

    text-shadow:

        0 3px 7px #000,

        0 0 8px
        rgba(0,0,0,.9);

    background:
        rgba(0,0,0,.12);

    padding:5px 8px;

    border-radius:8px;

    letter-spacing:.2px;
}


/* =====================================================
   CENTER LOGO
===================================================== */

.center-logo{

    position:absolute;

    z-index:50;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

    width:145px;

    height:145px;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            #122235,
            #020305
        );

    border:
        5px solid var(--gold);

    box-shadow:

        0 0 0 5px #050505,

        0 0 25px
        rgba(214,169,0,.65),

        0 0 45px
        rgba(6,43,85,.45);

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;
}


.center-logo img{

    width:88%;

    height:88%;

    object-fit:contain;
}


/* =====================================================
   RIGHT
===================================================== */

.right{

    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;
}


/* =====================================================
   RESULT BOX
===================================================== */

.result-box{

    width:220px;

    min-height:250px;

    padding:20px 18px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    background:

        linear-gradient(
            145deg,
            #0a1119,
            #020406
        );

    border:
        1px solid #19314A;

    border-top:
        4px solid var(--gold);

    box-shadow:

        0 10px 35px
        rgba(0,0,0,.7),

        0 0 20px
        rgba(6,43,85,.2);
}


/* =====================================================
   RESULT IMAGE
===================================================== */

.result-image{

    width:100px;

    height:100px;

    object-fit:contain;

    margin-bottom:12px;

    display:none;

    filter:

        drop-shadow(
            0 5px 8px
            rgba(0,0,0,.9)
        );
}


/* =====================================================
   RESULT TITLE
===================================================== */

.result-title{

    color:#9FAAB7;

    font-size:15px;

    margin-bottom:10px;
}


/* =====================================================
   RESULT
===================================================== */

.result{

    color:var(--gold-light);

    font-size:22px;

    font-weight:900;

    line-height:1.5;
}


/* =====================================================
   GIFT
===================================================== */

.gift{

    font-size:55px;

    margin-bottom:10px;
}


/* =====================================================
   HELP
===================================================== */

.help{

    margin-top:12px;

    color:#8F9AA7;

    font-size:12px;

    line-height:1.7;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    position:absolute;

    z-index:60;

    bottom:17px;

    left:50%;

    transform:
        translateX(-50%);

    white-space:nowrap;

    font-size:12px;

    color:#8994A0;
}


.footer span{

    color:var(--gold-light);

    font-weight:bold;
}


/* =====================================================
   WIN ANIMATION
===================================================== */

.winner{

    animation:
        winner .7s ease;
}


@keyframes winner{

    0%{
        transform:scale(1);
    }

    40%{
        transform:scale(1.03);
    }

    70%{
        transform:scale(.98);
    }

    100%{
        transform:scale(1);
    }
}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:1150px){

    .content{

        grid-template-columns:
            230px
            minmax(430px,1fr)
            190px;

        padding:
            40px 45px;
    }


    .title{
        font-size:42px;
    }


    .subtitle{
        font-size:15px;
    }


    .exclusive{
        font-size:13px;
    }


    .wheel-area{
        width:min(47vw,500px);
    }


    .prize img{

        width:88px;

        height:88px;

        top:-78px;
    }


    .prize-text{

        width:130px;

        font-size:14px;

        top:-68px;
    }


    .center-logo{

        width:120px;

        height:120px;
    }


    .result-box{

        width:180px;

        min-height:210px;
    }


    .result-image{

        width:75px;

        height:75px;
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .frame{

        width:100vw;

        height:100vh;

        border:none;
    }


    .content{

        display:flex;

        flex-direction:column;

        padding:
            18px 20px 10px;

        gap:0;
    }


    .left{

        height:auto;

        flex-shrink:0;
    }


    .top-logo{

        width:40px;

        height:40px;

        margin-bottom:2px;
    }


    .title{
        font-size:27px;
    }


    .red-line{

        width:55px;

        height:3px;

        margin:5px auto;
    }


    .subtitle{

        font-size:11px;

        line-height:1.5;
    }


    .exclusive{

        font-size:9px;

        margin-top:1px;
    }


    .spin-button{

        margin-top:8px;

        width:170px;

        padding:8px;

        font-size:16px;
    }


    .center{

        width:100%;

        flex:1;

        min-height:0;
    }


    .wheel-area{

        width:
            min(
                68vh,
                88vw
            );
    }


    .prize img{

        width:
            clamp(
                62px,
                15vw,
                90px
            );

        height:
            clamp(
                62px,
                15vw,
                90px
            );

        top:
            clamp(
                -82px,
                -12vw,
                -62px
            );
    }


    .prize-text{

        width:120px;

        font-size:13px;

        top:-65px;
    }


    .center-logo{

        width:82px;

        height:82px;

        border-width:4px;
    }


    .right{
        display:none;
    }


    .footer{

        bottom:7px;

        font-size:8px;
    }


    .corner{

        width:70px;

        height:3px;
    }


    .corner-v{

        width:3px;

        height:50px;
    }
}


/* =====================================================
   VERY SHORT MOBILE
===================================================== */

@media(
    max-width:700px
)
and
(
    max-height:650px
){

    .content{
        padding-top:10px;
    }


    .top-logo{

        width:30px;

        height:30px;
    }


    .title{
        font-size:22px;
    }


    .subtitle{
        font-size:9px;
    }


    .exclusive{
        font-size:8px;
    }


    .spin-button{

        margin-top:4px;

        padding:5px;

        font-size:13px;
    }


    .wheel-area{

        width:
            min(
                60vh,
                80vw
            );
    }


    .center-logo{

        width:68px;

        height:68px;
    }


    .prize img{

        width:58px;

        height:58px;

        top:-62px;
    }


    .prize-text{

        font-size:11px;

        width:100px;

        top:-55px;
    }
}


/* =====================================================
   LANDSCAPE MOBILE
===================================================== */

@media(
    max-height:550px
)
and
(
    orientation:landscape
){

    .content{

        display:grid;

        grid-template-columns:
            220px
            1fr
            180px;

        padding:
            25px 45px;
    }


    .title{
        font-size:28px;
    }


    .subtitle{
        font-size:11px;
    }


    .exclusive{
        font-size:9px;
    }


    .spin-button{

        margin-top:7px;

        padding:7px;

        font-size:14px;
    }


    .wheel-area{

        width:
            min(
                72vh,
                44vw
            );
    }


    .center-logo{

        width:80px;

        height:80px;
    }


    .prize img{

        width:65px;

        height:65px;

        top:-67px;
    }


    .prize-text{

        width:100px;

        font-size:11px;

        top:-58px;
    }


    .result-box{

        width:160px;

        min-height:180px;
    }


    .result-image{

        width:60px;

        height:60px;
    }


    .footer{
        font-size:8px;
    }

}

</style>

</head>

<script>


/* =====================================================
   PRIZES
=====================================================

   ملاحظة:

   F1  = حظر اوفر
   F7  = حظر اوفر
   F10 = حظر اوفر

===================================================== */


const prizes = [


    {
        id:"F_1",

        image:null,

        name:"حظر اوفر",

        textOnly:true
    },


    {
        id:"F_2",

        image:"F_2.JPG",

        name:"الجائزة رقم 2",

        textOnly:false
    },


    {
        id:"F_3",

        image:"F_3.JPG",

        name:"الجائزة رقم 3",

        textOnly:false
    },


    {
        id:"F_4",

        image:"F_4.JPG",

        name:"الجائزة رقم 4",

        textOnly:false
    },


    {
        id:"F_5",

        image:"F_5.JPG",

        name:"الجائزة رقم 5",

        textOnly:false
    },


    {
        id:"F_6",

        image:"F_6.JPG",

        name:"الجائزة رقم 6",

        textOnly:false
    },


    {
        id:"F_7",

        image:null,

        name:"حظر اوفر",

        textOnly:true
    },


    {
        id:"F_8",

        image:"F_8.JPG",

        name:"الجائزة رقم 8",

        textOnly:false
    },


    {
        id:"F_9",

        image:"F_9.JPG",

        name:"الجائزة رقم 9",

        textOnly:false
    },


    {
        id:"F_10",

        image:null,

        name:"حظر اوفر",

        textOnly:true
    }

];



/* =====================================================
   SPIN SETTINGS
===================================================== */


let spinCount = 0;


let currentRotation = 0;


let spinning = false;



/* =====================================================
   SPECIAL PRIZES
=====================================================

   F3 = كل 20 سحبة
   F5 = كل 15 سحبة

   F1 صار حظر اوفر لذلك
   لا يتم استخدامه كجائزة خاصة.

===================================================== */


function getScheduledPrize(){


    /* ==============================
       كل 20 سحبة = F3
    ============================== */

    if(
        spinCount % 20 === 0
    ){

        return 2;

    }



    /* ==============================
       كل 15 سحبة = F5
    ============================== */

    if(
        spinCount % 15 === 0
    ){

        return 4;

    }



    return null;

}



/* =====================================================
   NORMAL PRIZES
===================================================== */


function getRandomNormalPrize(){


    /*
       الجوائز العادية:

       F2
       F4
       F6
       F8
       F9

       ونستبعد:

       F1
       F7
       F10

       لأنها أصبحت حظر اوفر.
    */


    const normalPrizes = [


        1,


        3,


        5,


        7,


        8

    ];



    const randomIndex =

        Math.floor(

            Math.random()
            *
            normalPrizes.length

        );



    return normalPrizes[
        randomIndex
    ];

}



/* =====================================================
   SPIN WHEEL
===================================================== */


function spinWheel(){


    if(spinning){

        return;

    }


    spinning = true;



    const wheel =
        document.getElementById(
            "wheel"
        );



    const button =
        document.getElementById(
            "spinButton"
        );



    const result =
        document.getElementById(
            "result"
        );



    const resultImage =
        document.getElementById(
            "resultImage"
        );



    const gift =
        document.getElementById(
            "gift"
        );



    const wheelArea =
        document.getElementById(
            "wheelArea"
        );



    /* تعطيل الزر */

    button.disabled = true;



    /* زيادة رقم السحبة */

    spinCount++;



    /* رسالة الدوران */

    result.innerHTML =
        "الرولة تدور...";



    resultImage.style.display =
        "none";



    gift.style.display =
        "block";



    /* =================================================
       تحديد الجائزة
    ================================================= */


    let selected =
        getScheduledPrize();



    if(
        selected === null
    ){

        selected =
            getRandomNormalPrize();

    }



    /* =================================================
       حساب القطاع
    ================================================= */


    const sector =
        360 / prizes.length;



    /*
       منتصف القطاع
    */

    const target =
        selected *
        sector
        +
        sector / 2;



    /*
       الدوران الحالي
    */

    const currentMod =

        (
            currentRotation
            %
            360
            +
            360
        )
        %
        360;



    /*
       تصحيح اتجاه الرولة
    */

    let correction =

        (
            360
            -
            (
                (
                    currentMod
                    +
                    target
                )
                %
                360
            )
        )
        %
        360;



    /*
       7 دورات كاملة
    */

    const extra =
        360 * 7;



    const finalRotation =

        currentRotation
        +
        extra
        +
        correction;



    currentRotation =
        finalRotation;



    /* =================================================
       تدوير الرولة
    ================================================= */


    wheel.style.transform =

        `rotate(${finalRotation}deg)`;



    /* =================================================
       إظهار النتيجة
    ================================================= */


    setTimeout(

        function(){


            const prize =
                prizes[selected];



            /*
               إذا عندها صورة
            */

            if(
                prize.image
            ){

                resultImage.src =
                    prize.image;

                resultImage.style.display =
                    "block";

            }

            else{

                resultImage.style.display =
                    "none";

            }



            gift.style.display =
                "none";



            result.innerHTML =

                "🎉 مبروك!<br>"
                +
                prize.name;



            wheelArea.classList.add(
                "winner"
            );



            setTimeout(

                function(){

                    wheelArea.classList.remove(
                        "winner"
                    );

                },

                700

            );



            spinning = false;


            button.disabled = false;


        },

        5600

    );

}



/* =====================================================
   PRELOAD IMAGES
===================================================== */


window.addEventListener(

    "load",

    function(){


        prizes.forEach(

            function(prize){


                if(
                    prize.image
                ){

                    const image =
                        new Image();


                    image.src =
                        prize.image;

                }

            }

        );

    }

);

</script>
