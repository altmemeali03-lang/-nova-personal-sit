<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فؤاد فون | اضغط واربح</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at center,
            #292929 0%,
            #111 55%,
            #050505 100%
        );

    color:#fff;
}


/* =====================================================
   BACKGROUND LOGO
===================================================== */

body::before{

    content:"";

    position:fixed;

    inset:-100px;

    z-index:0;

    background-image:url("logo.png");

    background-repeat:repeat;

    background-size:170px;

    opacity:.035;

    transform:rotate(-12deg);

    pointer-events:none;

}


/* =====================================================
   RED LIGHT EFFECT
===================================================== */

body::after{

    content:"";

    position:fixed;

    width:700px;
    height:700px;

    border-radius:50%;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(210,0,0,.12),
            transparent 65%
        );

    pointer-events:none;

}


/* =====================================================
   MAIN SCREEN
===================================================== */

.main{

    position:relative;

    z-index:2;

    width:100vw;

    height:100vh;

    min-height:500px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:flex-start;

    padding:
        clamp(10px,2vh,25px)
        15px;

}


/* =====================================================
   HEADER
===================================================== */

.header{

    width:100%;

    text-align:center;

    flex-shrink:0;

}


/* =====================================================
   LOGO
===================================================== */

.header-logo{

    width:
        clamp(
            45px,
            8vh,
            80px
        );

    height:
        clamp(
            45px,
            8vh,
            80px
        );

    object-fit:contain;

    margin-bottom:
        clamp(2px,1vh,10px);

    filter:
        drop-shadow(
            0 4px 12px
            rgba(0,0,0,.5)
        );

}


/* =====================================================
   TITLE
===================================================== */

.title{

    font-size:
        clamp(
            25px,
            5vh,
            48px
        );

    font-weight:900;

    color:#fff;

    line-height:1.1;

    margin-bottom:7px;

}


.title::after{

    content:"";

    display:block;

    width:70px;

    height:3px;

    margin:8px auto 0;

    background:#e00000;

    border-radius:10px;

}


/* =====================================================
   SUBTITLE
===================================================== */

.subtitle{

    font-size:
        clamp(
            13px,
            2.4vh,
            21px
        );

    font-weight:bold;

    line-height:1.45;

    color:#fff;

}


.subtitle .red{

    color:#e00000;

}


/* =====================================================
   EXCLUSIVE
===================================================== */

.exclusive{

    font-size:
        clamp(
            12px,
            2vh,
            18px
        );

    color:#cfcfcf;

    margin-top:2px;

}


/* =====================================================
   BUTTON
===================================================== */

.cta{

    margin-top:
        clamp(8px,1.8vh,18px);

}


.spin-button{

    border:2px solid #ff1a1a;

    background:
        linear-gradient(
            135deg,
            #e00000,
            #9c0000
        );

    color:#fff;

    min-width:
        clamp(
            180px,
            28vw,
            270px
        );

    padding:
        clamp(9px,1.5vh,15px)
        25px;

    border-radius:12px;

    font-size:
        clamp(
            16px,
            2.5vh,
            24px
        );

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 7px 25px
        rgba(220,0,0,.3);

    transition:.2s;

}


.spin-button:hover{

    transform:translateY(-2px);

    background:
        linear-gradient(
            135deg,
            #ff1010,
            #b00000
        );

}


.spin-button:active{

    transform:scale(.96);

}


.spin-button:disabled{

    opacity:.55;

    cursor:not-allowed;

}


/* =====================================================
   ARROW
===================================================== */

.arrow{

    display:block;

    font-size:
        clamp(
            18px,
            2.5vh,
            25px
        );

    line-height:12px;

    animation:
        arrowMove
        1s
        infinite;

}


@keyframes arrowMove{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(4px);
    }

}


/* =====================================================
   WHEEL AREA
===================================================== */

.wheel-area{

    position:relative;

    width:
        min(
            65vh,
            72vw,
            560px
        );

    aspect-ratio:1;

    margin-top:
        clamp(
            8px,
            1.5vh,
            18px
        );

    flex-shrink:1;

}


/* =====================================================
   POINTER
===================================================== */

.pointer{

    position:absolute;

    z-index:50;

    top:-4px;

    left:50%;

    transform:
        translateX(-50%);

    width:0;

    height:0;

    border-left:
        clamp(16px,3vw,27px)
        solid transparent;

    border-right:
        clamp(16px,3vw,27px)
        solid transparent;

    border-top:
        clamp(40px,6vh,62px)
        solid #e00000;

    filter:
        drop-shadow(
            0 5px 4px
            rgba(0,0,0,.7)
        );

}


/* pointer top circle */

.pointer::before{

    content:"";

    position:absolute;

    width:
        clamp(
            22px,
            4vh,
            35px
        );

    height:
        clamp(
            22px,
            4vh,
            35px
        );

    border-radius:50%;

    background:#111;

    border:3px solid #e00000;

    left:50%;

    top:
        clamp(
            -56px,
            -5.5vh,
            -35px
        );

    transform:
        translateX(-50%);

}


/* =====================================================
   WHEEL
===================================================== */

.wheel{

    position:absolute;

    inset:0;

    border-radius:50%;

    border:
        clamp(
            5px,
            1vh,
            10px
        )
        solid #080808;

    overflow:hidden;

    background:

        conic-gradient(

            #e00000 0deg 36deg,

            #181818 36deg 72deg,

            #c90000 72deg 108deg,

            #292929 108deg 144deg,

            #e00000 144deg 180deg,

            #181818 180deg 216deg,

            #c90000 216deg 252deg,

            #292929 252deg 288deg,

            #e00000 288deg 324deg,

            #181818 324deg 360deg

        );

    box-shadow:

        0 8px 0 #000,

        0 18px 45px
        rgba(0,0,0,.7);

    transition:
        transform
        5s
        cubic-bezier(
            .12,
            .72,
            .12,
            1
        );

}


/* =====================================================
   WHEEL DIVIDERS
===================================================== */

.dividers{

    position:absolute;

    inset:0;

    border-radius:50%;

    background:

        repeating-conic-gradient(

            from -18deg,

            transparent 0deg 35deg,

            rgba(255,255,255,.28)
            35deg 36deg

        );

    z-index:3;

    pointer-events:none;

}


/* =====================================================
   INNER CIRCLE BORDER
===================================================== */

.wheel::after{

    content:"";

    position:absolute;

    inset:15px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.2);

    z-index:2;

}


/* =====================================================
   PRIZES
===================================================== */

.prize{

    position:absolute;

    width:50%;

    height:50%;

    left:50%;

    top:50%;

    transform-origin:0 0;

    display:flex;

    justify-content:center;

    align-items:flex-start;

    padding-top:
        clamp(
            18px,
            4vh,
            42px
        );

    z-index:6;

}


.prize span{

    width:
        clamp(
            75px,
            12vh,
            125px
        );

    text-align:center;

    font-size:
        clamp(
            10px,
            2vh,
            17px
        );

    font-weight:900;

    line-height:1.35;

    color:#fff;

    text-shadow:
        0 2px 3px
        rgba(0,0,0,.8);

}


/* =====================================================
   10 SECTORS
===================================================== */

.p1{
    transform:
        rotate(0deg)
        skewY(-54deg);
}

.p2{
    transform:
        rotate(36deg)
        skewY(-54deg);
}

.p3{
    transform:
        rotate(72deg)
        skewY(-54deg);
}

.p4{
    transform:
        rotate(108deg)
        skewY(-54deg);
}

.p5{
    transform:
        rotate(144deg)
        skewY(-54deg);
}

.p6{
    transform:
        rotate(180deg)
        skewY(-54deg);
}

.p7{
    transform:
        rotate(216deg)
        skewY(-54deg);
}

.p8{
    transform:
        rotate(252deg)
        skewY(-54deg);
}

.p9{
    transform:
        rotate(288deg)
        skewY(-54deg);
}

.p10{
    transform:
        rotate(324deg)
        skewY(-54deg);
}


/* =====================================================
   CENTER LOGO
===================================================== */

.center{

    position:absolute;

    width:
        clamp(
            70px,
            14vh,
            125px
        );

    height:
        clamp(
            70px,
            14vh,
            125px
        );

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:#fff;

    border:
        clamp(
            4px,
            .8vh,
            8px
        )
        solid #000;

    box-shadow:

        0 0 0
        clamp(
            3px,
            .7vh,
            6px
        )
        #e00000,

        0 6px 20px
        rgba(0,0,0,.7);

    z-index:30;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

}


.center img{

    width:88%;

    height:88%;

    object-fit:contain;

}


/* =====================================================
   RESULT
===================================================== */

.result{

    position:absolute;

    left:50%;

    bottom:
        clamp(
            -70px,
            -8vh,
            -40px
        );

    transform:
        translateX(-50%);

    width:
        min(
            90vw,
            400px
        );

    text-align:center;

    font-size:
        clamp(
            12px,
            2vh,
            18px
        );

    font-weight:bold;

    color:#fff;

}


.result span{

    color:#ff1717;

}


/* =====================================================
   WIN ANIMATION
===================================================== */

.winner{

    animation:
        winner
        .6s
        ease;

}


@keyframes winner{

    0%{
        transform:scale(1);
    }

    30%{
        transform:scale(1.04);
    }

    60%{
        transform:scale(.98);
    }

    100%{
        transform:scale(1);
    }

}


/* =====================================================
   SMALL SCREEN HEIGHT
===================================================== */

@media(max-height:650px){

    .main{

        padding-top:7px;

    }

    .header-logo{

        width:42px;

        height:42px;

        margin-bottom:2px;

    }

    .title{

        font-size:25px;

    }

    .title::after{

        margin-top:4px;

    }

    .subtitle{

        font-size:13px;

    }

    .exclusive{

        font-size:12px;

    }

    .cta{

        margin-top:5px;

    }

    .spin-button{

        padding:7px 22px;

        font-size:16px;

    }

    .wheel-area{

        margin-top:5px;

        width:
            min(
                61vh,
                70vw
            );

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .main{

        padding-left:8px;

        padding-right:8px;

    }

    .wheel-area{

        width:
            min(
                61vh,
                94vw
            );

    }

    .prize span{

        font-size:10px;

    }

}


/* =====================================================
   VERY SMALL HEIGHT
===================================================== */

@media(max-height:550px){

    .wheel-area{

        width:
            min(
                55vh,
                65vw
            );

    }

    .result{

        display:none;

    }

}


/* =====================================================
   LANDSCAPE MOBILE
===================================================== */

@media(
    max-height:500px
) and (
    orientation:landscape
){

    .main{

        flex-direction:row;

        justify-content:center;

        align-items:center;

        gap:35px;

        padding:10px 25px;

    }

    .header{

        width:38%;

    }

    .wheel-area{

        width:
            min(
                85vh,
                48vw
            );

        margin:0;

    }

    .cta{

        margin-top:10px;

    }

}


/* =====================================================
   NO SELECT
===================================================== */

button,
img{

    user-select:none;

    -webkit-user-select:none;

    -webkit-tap-highlight-color:
        transparent;

}

</style>

</head>


<body>


<div class="main">


    <!-- =================================================
         HEADER
    ================================================= -->

    <header class="header">


        <img
            src="logo.png"
            class="header-logo"
            alt="فؤاد فون"
        >


        <h1 class="title">
            فؤاد فون
        </h1>


        <div class="subtitle">

            الراعي الرسمي لـ
            <span class="red">
                مؤتمر CGC IRAQ 🇮🇶
            </span>

        </div>


        <div class="exclusive">

            الوكيل الحصري لشركة UAM في العراق

        </div>


        <div class="cta">

            <button
                class="spin-button"
                id="spinButton"
                onclick="spinWheel()"
            >

                اضغط واربح

                <span class="arrow">
                    ↓
                </span>

            </button>

        </div>


    </header>



    <!-- =================================================
         WHEEL
    ================================================= -->

    <div
        class="wheel-area"
        id="wheelArea"
    >


        <!-- POINTER -->

        <div class="pointer"></div>


        <!-- WHEEL -->

        <div
            class="wheel"
            id="wheel"
        >


            <div class="dividers"></div>


            <div class="prize p1">
                <span>جائزة ١</span>
            </div>


            <div class="prize p2">
                <span>جائزة ٢</span>
            </div>


            <div class="prize p3">
                <span>جائزة ٣</span>
            </div>


            <div class="prize p4">
                <span>جائزة ٤</span>
            </div>


            <div class="prize p5">
                <span>جائزة ٥</span>
            </div>


            <div class="prize p6">
                <span>جائزة ٦</span>
            </div>


            <div class="prize p7">
                <span>جائزة ٧</span>
            </div>


            <div class="prize p8">
                <span>جائزة ٨</span>
            </div>


            <div class="prize p9">
                <span>جائزة ٩</span>
            </div>


            <div class="prize p10">
                <span>جائزة ١٠</span>
            </div>


        </div>


        <!-- CENTER LOGO -->

        <div class="center">

            <img
                src="logo.png"
                alt="فؤاد فون"
            >

        </div>


        <!-- RESULT -->

        <div
            class="result"
            id="result"
        >

            جرّب حظك 🎁

        </div>


    </div>


</div>



<script>

/* =====================================================
   PRIZES
===================================================== */

const prizes = [

    "جائزة ١",
    "جائزة ٢",
    "جائزة ٣",
    "جائزة ٤",
    "جائزة ٥",
    "جائزة ٦",
    "جائزة ٧",
    "جائزة ٨",
    "جائزة ٩",
    "جائزة ١٠"

];


let currentRotation = 0;

let spinning = false;


/* =====================================================
   SPIN
===================================================== */

function spinWheel(){

    if(spinning){

        return;

    }


    spinning = true;


    const wheel =
        document.getElementById("wheel");


    const button =
        document.getElementById("spinButton");


    const result =
        document.getElementById("result");


    const wheelArea =
        document.getElementById("wheelArea");


    button.disabled = true;


    result.innerHTML =
        "الرولة تدور... 🎡";


    /* اختيار جائزة عشوائية */

    const randomIndex =
        Math.floor(
            Math.random() *
            prizes.length
        );


    /* كل خانة 36 درجة */

    const sector = 36;


    /* منتصف القطاع */

    const targetAngle =
        randomIndex * sector + 18;


    /* عدد الدورات */

    const extraSpins =
        360 * 7;


    /*
       نخلي القطاع المختار
       يوقف عند السهم بالأعلى
    */

    const finalRotation =
        currentRotation +
        extraSpins +
        (360 - targetAngle);


    currentRotation =
        finalRotation;


    wheel.style.transform =
        `rotate(${finalRotation}deg)`;


    /* انتظار انتهاء الدوران */

    setTimeout(function(){

        result.innerHTML =
            `🎉 مبروك! <span>${prizes[randomIndex]}</span>`;


        wheelArea.classList.add(
            "winner"
        );


        setTimeout(function(){

            wheelArea.classList.remove(
                "winner"
            );

        },600);


        spinning = false;

        button.disabled = false;


    },5200);

}


/* =====================================================
   IMAGE DRAG DISABLE
===================================================== */

document
    .querySelectorAll("img")
    .forEach(function(img){

        img.addEventListener(
            "dragstart",
            function(e){

                e.preventDefault();

            }
        );

    });

</script>


</body>

</html>
