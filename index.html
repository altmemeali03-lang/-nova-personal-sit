<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فؤاد فون | اضغط واربح</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Tahoma, Arial, sans-serif;
    background:
        radial-gradient(circle at center,#242424 0%,#0b0b0b 70%);
    color:#fff;
}


/* =========================================================
   BACKGROUND LOGO
========================================================= */

body::before{
    content:"";
    position:fixed;
    inset:-100px;
    z-index:0;

    background-image:url("logo.png");
    background-repeat:repeat;
    background-size:180px;

    opacity:.035;
    transform:rotate(-10deg);
    pointer-events:none;
}


/* =========================================================
   SCREEN
========================================================= */

.screen{
    width:100vw;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:18px;
}


/* =========================================================
   MAIN HORIZONTAL FRAME
========================================================= */

.frame{

    position:relative;

    width:min(1450px,96vw);
    height:min(780px,94vh);

    background:
        linear-gradient(
            135deg,
            #101010,
            #181818 50%,
            #080808
        );

    border:2px solid #333;

    box-shadow:
        0 0 0 2px #070707,
        0 0 35px rgba(220,0,0,.15),
        inset 0 0 40px rgba(0,0,0,.8);

    overflow:hidden;
}


/* =========================================================
   CYBER FRAME LINES
========================================================= */

.frame::before{
    content:"";

    position:absolute;
    inset:12px;

    border:2px solid #444;

    pointer-events:none;
    z-index:20;

    clip-path:polygon(
        0 0,
        12% 0,
        13% 3px,
        87% 3px,
        88% 0,
        100% 0,
        100% 12%,
        calc(100% - 3px) 13%,
        calc(100% - 3px) 87%,
        100% 88%,
        100% 100%,
        88% 100%,
        87% calc(100% - 3px),
        13% calc(100% - 3px),
        12% 100%,
        0 100%,
        0 88%,
        3px 87%,
        3px 13%,
        0 12%
    );
}


/* =========================================================
   RED CYBER CORNERS
========================================================= */

.corner{
    position:absolute;
    z-index:25;
    pointer-events:none;
}

.corner span{
    display:block;
    background:#e00000;
    box-shadow:0 0 10px rgba(255,0,0,.5);
}


/* TOP LEFT */

.corner.tl{
    top:22px;
    left:28px;
    width:145px;
    height:45px;
}

.corner.tl span:nth-child(1){
    width:90px;
    height:4px;
}

.corner.tl span:nth-child(2){
    width:4px;
    height:35px;
    margin-left:0;
}

.corner.tl span:nth-child(3){
    width:45px;
    height:4px;
    margin-left:0;
}


/* TOP RIGHT */

.corner.tr{
    top:22px;
    right:28px;
    width:145px;
    height:45px;
    transform:scaleX(-1);
}


/* BOTTOM LEFT */

.corner.bl{
    bottom:22px;
    left:28px;
    width:145px;
    height:45px;
    transform:scaleY(-1);
}


/* BOTTOM RIGHT */

.corner.br{
    bottom:22px;
    right:28px;
    width:145px;
    height:45px;
    transform:scale(-1,-1);
}


/* =========================================================
   SIDE RED LINES
========================================================= */

.side-line{
    position:absolute;
    top:110px;
    bottom:110px;
    width:4px;

    background:
        repeating-linear-gradient(
            to bottom,
            #e00000 0 55px,
            transparent 55px 85px
        );

    box-shadow:
        0 0 10px rgba(255,0,0,.4);

    z-index:21;
}

.side-line.left{
    left:27px;
}

.side-line.right{
    right:27px;
}


/* =========================================================
   CONTENT
========================================================= */

.content{

    position:relative;
    z-index:10;

    width:100%;
    height:100%;

    display:grid;

    grid-template-columns:
        minmax(280px, .85fr)
        minmax(400px, 1.35fr)
        minmax(280px, .85fr);

    align-items:center;

    gap:15px;

    padding:45px 70px;
}


/* =========================================================
   LEFT AREA
========================================================= */

.left-area{

    height:100%;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;
}


.logo-top{
    width:90px;
    height:90px;
    object-fit:contain;

    margin-bottom:15px;

    filter:
        drop-shadow(0 5px 15px rgba(0,0,0,.6));
}


.title{

    font-size:clamp(32px,4vw,58px);

    font-weight:900;

    color:#fff;

    line-height:1.1;

    margin-bottom:12px;
}


.title::after{

    content:"";

    display:block;

    width:80px;
    height:4px;

    margin:12px auto;

    background:#e00000;

    box-shadow:
        0 0 10px rgba(255,0,0,.5);
}


.subtitle{

    font-size:clamp(16px,1.7vw,23px);

    font-weight:bold;

    line-height:1.7;

    color:#fff;
}


.subtitle .red{
    color:#e00000;
}


.exclusive{

    margin-top:8px;

    font-size:clamp(14px,1.4vw,19px);

    color:#bbb;

    line-height:1.6;
}


/* =========================================================
   BUTTON
========================================================= */

.spin-button{

    margin-top:30px;

    min-width:220px;

    padding:16px 30px;

    border:2px solid #ff2222;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #e00000,
            #970000
        );

    color:#fff;

    font-size:22px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 8px 25px rgba(220,0,0,.3);

    transition:.2s;
}


.spin-button:hover{

    transform:translateY(-3px);

    box-shadow:
        0 12px 30px rgba(220,0,0,.5);
}


.spin-button:active{
    transform:scale(.96);
}


.spin-button:disabled{
    opacity:.55;
    cursor:not-allowed;
}


.arrow{

    display:block;

    font-size:25px;

    line-height:15px;

    animation:
        arrowMove 1s infinite;
}


@keyframes arrowMove{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(5px);
    }
}


/* =========================================================
   CENTER AREA
========================================================= */

.center-area{

    height:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    position:relative;
}


/* =========================================================
   WHEEL
========================================================= */

.wheel-area{

    position:relative;

    width:min(42vw,560px);

    aspect-ratio:1;
}


/* =========================================================
   POINTER
========================================================= */

.pointer{

    position:absolute;

    z-index:50;

    top:-14px;

    left:50%;

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:25px solid transparent;
    border-right:25px solid transparent;
    border-top:62px solid #e00000;

    filter:
        drop-shadow(
            0 5px 5px rgba(0,0,0,.8)
        );
}


.pointer::before{

    content:"";

    position:absolute;

    width:32px;
    height:32px;

    border-radius:50%;

    background:#090909;

    border:3px solid #e00000;

    left:-16px;
    top:-60px;
}


/* =========================================================
   WHEEL
========================================================= */

.wheel{

    position:absolute;

    inset:0;

    border-radius:50%;

    border:9px solid #050505;

    background:

        conic-gradient(

            #e00000 0deg 36deg,
            #171717 36deg 72deg,
            #c50000 72deg 108deg,
            #292929 108deg 144deg,
            #e00000 144deg 180deg,
            #171717 180deg 216deg,
            #c50000 216deg 252deg,
            #292929 252deg 288deg,
            #e00000 288deg 324deg,
            #171717 324deg 360deg

        );

    overflow:hidden;

    box-shadow:

        0 8px 0 #000,

        0 20px 45px
        rgba(0,0,0,.75);

    transition:
        transform
        5s
        cubic-bezier(.12,.72,.12,1);
}


/* =========================================================
   WHEEL DIVIDERS
========================================================= */

.dividers{

    position:absolute;

    inset:0;

    border-radius:50%;

    background:

        repeating-conic-gradient(

            from -18deg,

            transparent 0deg 35deg,

            rgba(255,255,255,.3) 35deg 36deg

        );

    z-index:4;

}


/* =========================================================
   INNER RING
========================================================= */

.inner-ring{

    position:absolute;

    inset:18px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.25);

    z-index:3;

    pointer-events:none;
}


/* =========================================================
   PRIZES
========================================================= */

.prize{

    position:absolute;

    width:50%;
    height:50%;

    left:50%;
    top:50%;

    transform-origin:0 0;

    display:flex;

    justify-content:center;

    align-items:flex-start;

    padding-top:38px;

    z-index:7;
}


.prize span{

    width:125px;

    text-align:center;

    font-size:16px;

    font-weight:900;

    line-height:1.4;

    color:#fff;

    text-shadow:
        0 2px 4px #000;
}


/* =========================================================
   10 SECTORS
========================================================= */

.p1{
    transform:rotate(0deg) skewY(-54deg);
}

.p2{
    transform:rotate(36deg) skewY(-54deg);
}

.p3{
    transform:rotate(72deg) skewY(-54deg);
}

.p4{
    transform:rotate(108deg) skewY(-54deg);
}

.p5{
    transform:rotate(144deg) skewY(-54deg);
}

.p6{
    transform:rotate(180deg) skewY(-54deg);
}

.p7{
    transform:rotate(216deg) skewY(-54deg);
}

.p8{
    transform:rotate(252deg) skewY(-54deg);
}

.p9{
    transform:rotate(288deg) skewY(-54deg);
}

.p10{
    transform:rotate(324deg) skewY(-54deg);
}


/* =========================================================
   CENTER LOGO
========================================================= */

.center-logo{

    position:absolute;

    width:125px;
    height:125px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:#fff;

    border:8px solid #050505;

    box-shadow:

        0 0 0 5px #e00000,

        0 8px 20px
        rgba(0,0,0,.8);

    z-index:30;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;
}


.center-logo img{

    width:88%;
    height:88%;

    object-fit:contain;
}


/* =========================================================
   RIGHT AREA
========================================================= */

.right-area{

    height:100%;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;
}


.result-box{

    width:100%;

    max-width:300px;

    padding:25px 20px;

    border:1px solid #3d3d3d;

    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            #191919,
            #090909
        );

    box-shadow:
        inset 0 0 25px rgba(0,0,0,.8),
        0 8px 25px rgba(0,0,0,.3);
}


.result-label{

    color:#aaa;

    font-size:15px;

    margin-bottom:10px;
}


.result{

    font-size:25px;

    font-weight:900;

    color:#e00000;

    min-height:38px;
}


.info-line{

    width:100%;

    max-width:300px;

    margin-top:20px;

    padding:13px;

    border-right:4px solid #e00000;

    background:#111;

    color:#ddd;

    font-size:14px;

    line-height:1.7;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    position:absolute;

    bottom:23px;

    left:50%;

    transform:translateX(-50%);

    z-index:30;

    white-space:nowrap;

    font-size:12px;

    color:#aaa;
}


.footer .red{
    color:#e00000;
}


/* =========================================================
   WIN
========================================================= */

.winner{

    animation:
        winner .6s ease;
}


@keyframes winner{

    0%{
        transform:scale(1);
    }

    30%{
        transform:scale(1.04);
    }

    60%{
        transform:scale(.98);
    }

    100%{
        transform:scale(1);
    }
}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:1050px){

    .content{

        grid-template-columns:
            .8fr
            1.3fr
            .8fr;

        padding:
            40px 50px;
    }

    .wheel-area{

        width:min(42vw,480px);
    }

    .prize{

        padding-top:28px;
    }

    .prize span{

        width:95px;
        font-size:12px;
    }

    .center-logo{

        width:100px;
        height:100px;
    }

}


/* =========================================================
   MOBILE PORTRAIT
========================================================= */

@media(max-width:700px){

    html,
    body{

        overflow:hidden;
    }

    .screen{

        padding:8px;
    }

    .frame{

        width:100vw;
        height:calc(100vh - 16px);

        min-height:0;
    }

    .content{

        display:flex;

        flex-direction:column;

        justify-content:flex-start;

        padding:
            25px 35px 20px;

        gap:5px;
    }

    .left-area{

        height:auto;

        flex-shrink:0;
    }

    .logo-top{

        width:45px;
        height:45px;

        margin-bottom:4px;
    }

    .title{

        font-size:28px;

        margin-bottom:3px;
    }

    .title::after{

        width:50px;
        height:2px;

        margin:5px auto;
    }

    .subtitle{

        font-size:12px;

        line-height:1.45;
    }

    .exclusive{

        font-size:11px;

        margin-top:0;
    }

    .spin-button{

        margin-top:8px;

        min-width:170px;

        padding:8px 20px;

        font-size:17px;
    }

    .arrow{

        font-size:19px;
    }

    .center-area{

        height:auto;

        flex:1;

        min-height:0;

        width:100%;
    }

    .wheel-area{

        width:min(65vh,82vw);

        max-width:430px;
    }

    .right-area{

        position:absolute;

        bottom:30px;

        right:25px;

        height:auto;
    }

    .result-box{

        display:none;
    }

    .info-line{

        display:none;
    }

    .footer{

        bottom:12px;

        font-size:9px;
    }

    .side-line{

        top:80px;
        bottom:80px;
    }

}


/* =========================================================
   VERY SHORT SCREEN
========================================================= */

@media(max-height:650px){

    .content{

        padding-top:25px;
        padding-bottom:25px;
    }

    .logo-top{

        width:45px;
        height:45px;
    }

    .title{

        font-size:28px;
    }

    .subtitle{

        font-size:12px;
    }

    .exclusive{

        font-size:11px;
    }

    .spin-button{

        margin-top:8px;

        padding:7px 20px;

        font-size:16px;
    }

    .wheel-area{

        width:min(60vh,75vw);
    }

}


/* =========================================================
   LANDSCAPE MOBILE
========================================================= */

@media(
    max-height:550px
) and (
    orientation:landscape
){

    .content{

        grid-template-columns:
            .9fr
            1.4fr
            .8fr;

        display:grid;

        padding:
            25px 45px;
    }

    .left-area{

        height:100%;
    }

    .logo-top{

        width:40px;
        height:40px;
    }

    .title{

        font-size:25px;
    }

    .subtitle{

        font-size:11px;
    }

    .exclusive{

        font-size:10px;
    }

    .spin-button{

        margin-top:8px;

        padding:7px 15px;

        font-size:14px;
    }

    .wheel-area{

        width:min(75vh,42vw);
    }

    .center-logo{

        width:75px;
        height:75px;
    }

    .prize{

        padding-top:20px;
    }

    .prize span{

        font-size:9px;
        width:65px;
    }

}


/* =========================================================
   NO SELECT
========================================================= */

button,
img{

    user-select:none;

    -webkit-user-select:none;

    -webkit-tap-highlight-color:transparent;
}

</style>
</head>


<body>


<div class="screen">

    <div class="frame">


        <!-- CYBER CORNERS -->

        <div class="corner tl">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="corner tr">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="corner bl">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="corner br">
            <span></span>
            <span></span>
            <span></span>
        </div>


        <div class="side-line left"></div>
        <div class="side-line right"></div>


        <!-- CONTENT -->

        <div class="content">


            <!-- =========================================
                 LEFT
            ========================================== -->

            <div class="left-area">


                <img
                    src="logo.png"
                    class="logo-top"
                    alt="فؤاد فون"
                >


                <h1 class="title">
                    فؤاد فون
                </h1>


                <div class="subtitle">

                    الراعي الرسمي لـ
                    <span class="red">
                        مؤتمر CGC IRAQ 🇮🇶
                    </span>

                </div>


                <div class="exclusive">

                    الوكيل الحصري لشركة UAM في العراق

                </div>


                <button
                    class="spin-button"
                    id="spinButton"
                    onclick="spinWheel()"
                >

                    اضغط واربح

                    <span class="arrow">
                        ↓
                    </span>

                </button>


            </div>


            <!-- =========================================
                 CENTER
            ========================================== -->

            <div class="center-area">


                <div
                    class="wheel-area"
                    id="wheelArea"
                >


                    <!-- POINTER -->

                    <div class="pointer"></div>


                    <!-- WHEEL -->

                    <div
                        class="wheel"
                        id="wheel"
                    >


                        <div class="dividers"></div>

                        <div class="inner-ring"></div>


                        <div class="prize p1">
                            <span>جائزة ١</span>
                        </div>

                        <div class="prize p2">
                            <span>جائزة ٢</span>
                        </div>

                        <div class="prize p3">
                            <span>جائزة ٣</span>
                        </div>

                        <div class="prize p4">
                            <span>جائزة ٤</span>
                        </div>

                        <div class="prize p5">
                            <span>جائزة ٥</span>
                        </div>

                        <div class="prize p6">
                            <span>جائزة ٦</span>
                        </div>

                        <div class="prize p7">
                            <span>جائزة ٧</span>
                        </div>

                        <div class="prize p8">
                            <span>جائزة ٨</span>
                        </div>

                        <div class="prize p9">
                            <span>جائزة ٩</span>
                        </div>

                        <div class="prize p10">
                            <span>جائزة ١٠</span>
                        </div>


                    </div>


                    <!-- CENTER LOGO -->

                    <div class="center-logo">

                        <img
                            src="logo.png"
                            alt="فؤاد فون"
                        >

                    </div>


                </div>


            </div>


            <!-- =========================================
                 RIGHT
            ========================================== -->

            <div class="right-area">


                <div class="result-box">

                    <div class="result-label">
                        نتيجة السحب
                    </div>

                    <div
                        class="result"
                        id="result"
                    >
                        جرّب حظك 🎁
                    </div>

                </div>


                <div class="info-line">

                    🎁 اضغط على الزر
                    <br>
                    وخلي الرولة تختار جائزتك

                </div>


            </div>


        </div>


        <!-- FOOTER -->

        <div class="footer">

            <span class="red">📞</span>
            07747885760
            &nbsp; | &nbsp;
            فؤاد فون
            &nbsp; | &nbsp;
            بغداد

        </div>


    </div>

</div>



<script>

/* =========================================================
   PRIZES
========================================================= */

const prizes = [

    "جائزة ١",
    "جائزة ٢",
    "جائزة ٣",
    "جائزة ٤",
    "جائزة ٥",
    "جائزة ٦",
    "جائزة ٧",
    "جائزة ٨",
    "جائزة ٩",
    "جائزة ١٠"

];


let currentRotation = 0;

let spinning = false;


/* =========================================================
   SPIN WHEEL
========================================================= */

function spinWheel(){

    if(spinning){
        return;
    }


    spinning = true;


    const wheel =
        document.getElementById("wheel");

    const button =
        document.getElementById("spinButton");

    const result =
        document.getElementById("result");

    const wheelArea =
        document.getElementById("wheelArea");


    button.disabled = true;


    result.innerHTML =
        "الرولة تدور...";


    /* اختيار الخانة */

    const randomIndex =
        Math.floor(
            Math.random() *
            prizes.length
        );


    /* كل خانة 36 درجة */

    const sector = 36;


    /* منتصف الخانة */

    const targetAngle =
        randomIndex * sector + 18;


    /* 7 دورات كاملة */

    const extraSpins =
        360 * 7;


    /*
       توجيه الجائزة للسهم
    */

    const finalRotation =
        currentRotation +
        extraSpins +
        (360 - targetAngle);


    currentRotation =
        finalRotation;


    wheel.style.transform =
        `rotate(${finalRotation}deg)`;


    /* انتهاء الدوران */

    setTimeout(function(){

        result.innerHTML =
            `🎉 ${prizes[randomIndex]}`;


        wheelArea.classList.add(
            "winner"
        );


        setTimeout(function(){

            wheelArea.classList.remove(
                "winner"
            );

        },600);


        spinning = false;

        button.disabled = false;


    },5200);

}

</script>

</body>
</html>
