<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>فؤاد فون | اضغط واربح</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at center,
            #242424 0%,
            #111 45%,
            #050505 100%
        );

    color:#fff;
}


/* =====================================================
   BACKGROUND
===================================================== */

body::before{

    content:"";

    position:fixed;

    inset:-100px;

    z-index:0;

    background-image:
        url("Flogo.HEIC");

    background-repeat:
        repeat;

    background-size:
        180px;

    opacity:.025;

    transform:
        rotate(-12deg);

    pointer-events:none;
}


/* =====================================================
   MAIN SCREEN
===================================================== */

.screen{

    width:100vw;
    height:100vh;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:16px;
}


/* =====================================================
   MAIN FRAME
===================================================== */

.frame{

    position:relative;

    width:min(1500px,96vw);

    height:min(800px,94vh);

    overflow:hidden;

    background:

        radial-gradient(
            circle at center,
            #191919 0%,
            #0c0c0c 75%
        );

    border:
        2px solid #383838;

    box-shadow:

        0 0 0 3px #050505,

        0 0 45px
        rgba(220,0,0,.15),

        inset 0 0 60px
        rgba(0,0,0,.9);
}


/* =====================================================
   INNER FRAME
===================================================== */

.frame::before{

    content:"";

    position:absolute;

    inset:13px;

    border:
        2px solid #454545;

    z-index:20;

    pointer-events:none;
}


/* =====================================================
   CYBER RED LINES
===================================================== */

.red-line{

    position:absolute;

    background:#e00000;

    box-shadow:
        0 0 10px
        rgba(255,0,0,.7);

    z-index:25;
}


/* TOP */

.red-top-left{

    top:22px;
    left:30px;

    width:120px;
    height:4px;
}

.red-top-left-2{

    top:22px;
    left:30px;

    width:4px;
    height:45px;
}

.red-top-right{

    top:22px;
    right:30px;

    width:120px;
    height:4px;
}

.red-top-right-2{

    top:22px;
    right:30px;

    width:4px;
    height:45px;
}


/* BOTTOM */

.red-bottom-left{

    bottom:22px;
    left:30px;

    width:120px;
    height:4px;
}

.red-bottom-left-2{

    bottom:22px;
    left:30px;

    width:4px;
    height:45px;
}

.red-bottom-right{

    bottom:22px;
    right:30px;

    width:120px;
    height:4px;
}

.red-bottom-right-2{

    bottom:22px;
    right:30px;

    width:4px;
    height:45px;
}


/* =====================================================
   SIDE LINES
===================================================== */

.side-line{

    position:absolute;

    top:95px;
    bottom:95px;

    width:4px;

    background:

        repeating-linear-gradient(
            to bottom,
            #e00000 0 50px,
            transparent 50px 82px
        );

    box-shadow:
        0 0 10px
        rgba(255,0,0,.5);

    z-index:21;
}

.side-line.left{
    left:28px;
}

.side-line.right{
    right:28px;
}


/* =====================================================
   CONTENT
===================================================== */

.content{

    position:relative;

    width:100%;
    height:100%;

    z-index:10;

    display:grid;

    grid-template-columns:
        minmax(270px,.8fr)
        minmax(480px,1.5fr)
        minmax(250px,.7fr);

    align-items:center;

    gap:10px;

    padding:
        40px 65px;
}


/* =====================================================
   LEFT
===================================================== */

.left-area{

    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;
}


/* =====================================================
   TOP LOGO
===================================================== */

.logo-top{

    width:80px;
    height:80px;

    object-fit:contain;

    margin-bottom:12px;

    filter:
        drop-shadow(
            0 5px 15px
            rgba(0,0,0,.7)
        );
}


/* =====================================================
   TITLE
===================================================== */

.title{

    font-size:
        clamp(35px,4vw,60px);

    font-weight:900;

    line-height:1.1;

    color:#fff;

    text-shadow:
        0 4px 12px
        rgba(0,0,0,.8);
}


.title-line{

    width:90px;

    height:4px;

    background:#e00000;

    margin:
        14px auto;

    box-shadow:
        0 0 12px
        rgba(255,0,0,.6);
}


/* =====================================================
   SUBTITLE
===================================================== */

.subtitle{

    font-size:
        clamp(15px,1.5vw,22px);

    font-weight:bold;

    line-height:1.7;

    color:#fff;
}


.red-text{
    color:#e00000;
}


.exclusive{

    margin-top:7px;

    color:#bbb;

    font-size:
        clamp(13px,1.3vw,18px);

    line-height:1.6;
}


/* =====================================================
   BUTTON
===================================================== */

.spin-button{

    margin-top:28px;

    min-width:220px;

    padding:
        15px 28px;

    border:
        2px solid #ff2525;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #e00000,
            #8e0000
        );

    color:#fff;

    font-family:inherit;

    font-size:21px;

    font-weight:900;

    cursor:pointer;

    box-shadow:

        0 8px 25px
        rgba(220,0,0,.3);

    transition:.2s;
}


.spin-button:hover{

    transform:
        translateY(-3px);

    box-shadow:

        0 12px 35px
        rgba(255,0,0,.45);
}


.spin-button:active{

    transform:
        scale(.96);
}


.spin-button:disabled{

    opacity:.55;

    cursor:not-allowed;
}


.arrow{

    display:block;

    margin-top:3px;

    font-size:24px;

    animation:
        arrowMove 1s infinite;
}


@keyframes arrowMove{

    0%,
    100%{
        transform:
            translateY(0);
    }

    50%{
        transform:
            translateY(5px);
    }
}


/* =====================================================
   CENTER
===================================================== */

.center-area{

    width:100%;
    height:100%;

    display:flex;

    justify-content:center;
    align-items:center;
}


/* =====================================================
   WHEEL AREA
===================================================== */

.wheel-area{

    position:relative;

    width:
        min(43vw,560px);

    aspect-ratio:1;

    display:flex;

    justify-content:center;
    align-items:center;
}


/* =====================================================
   POINTER
===================================================== */

.pointer{

    position:absolute;

    z-index:80;

    top:-16px;

    left:50%;

    transform:
        translateX(-50%);

    width:0;
    height:0;

    border-left:
        25px solid transparent;

    border-right:
        25px solid transparent;

    border-top:
        62px solid #e00000;

    filter:
        drop-shadow(
            0 5px 5px
            rgba(0,0,0,.9)
        );
}


.pointer::after{

    content:"";

    position:absolute;

    left:-12px;
    top:-60px;

    width:24px;
    height:24px;

    border-radius:50%;

    background:#111;

    border:
        3px solid #fff;
}


/* =====================================================
   WHEEL
===================================================== */

.wheel{

    position:absolute;

    inset:0;

    border-radius:50%;

    border:
        8px solid #030303;

    background:

        conic-gradient(

            #d80000 0deg 36deg,
            #171717 36deg 72deg,

            #e60000 72deg 108deg,
            #202020 108deg 144deg,

            #c90000 144deg 180deg,
            #151515 180deg 216deg,

            #e00000 216deg 252deg,
            #202020 252deg 288deg,

            #c90000 288deg 324deg,
            #151515 324deg 360deg
        );

    box-shadow:

        0 10px 0 #000,

        0 20px 45px
        rgba(0,0,0,.8);

    transition:

        transform
        5.5s
        cubic-bezier(
            .12,
            .72,
            .12,
            1
        );

    overflow:hidden;
}


/* =====================================================
   WHEEL DIVIDERS
===================================================== */

.wheel::before{

    content:"";

    position:absolute;

    inset:0;

    border-radius:50%;

    background:

        repeating-conic-gradient(

            from -18deg,

            transparent 0deg 35deg,

            rgba(255,255,255,.38)
            35deg 36deg
        );

    z-index:5;

    pointer-events:none;
}


/* =====================================================
   INNER CIRCLE
===================================================== */

.wheel-inner{

    position:absolute;

    inset:15px;

    border-radius:50%;

    border:
        2px solid
        rgba(255,255,255,.18);

    z-index:4;

    pointer-events:none;
}


/* =====================================================
   PRIZE IMAGE
===================================================== */

.prize{

    position:absolute;

    left:50%;
    top:50%;

    width:45%;

    height:45%;

    margin-left:-22.5%;
    margin-top:-22.5%;

    display:flex;

    justify-content:center;
    align-items:flex-start;

    transform-origin:center center;

    z-index:10;

    pointer-events:none;
}


/*
   كل صورة تبقى مستقيمة
   وتتحرك لمكان الخانة
*/

.prize img{

    width:
        clamp(48px,7vw,100px);

    height:
        clamp(48px,7vw,100px);

    object-fit:contain;

    position:absolute;

    top:-3px;

    left:50%;

    transform:
        translateX(-50%);

    filter:
        drop-shadow(
            0 4px 5px
            rgba(0,0,0,.9)
        );
}


/* =====================================================
   PRIZE POSITIONS
===================================================== */

.p1{
    transform:
        rotate(0deg)
        translateY(-145%);
}

.p2{
    transform:
        rotate(36deg)
        translateY(-145%);
}

.p3{
    transform:
        rotate(72deg)
        translateY(-145%);
}

.p4{
    transform:
        rotate(108deg)
        translateY(-145%);
}

.p5{
    transform:
        rotate(144deg)
        translateY(-145%);
}

.p6{
    transform:
        rotate(180deg)
        translateY(-145%);
}

.p7{
    transform:
        rotate(216deg)
        translateY(-145%);
}

.p8{
    transform:
        rotate(252deg)
        translateY(-145%);
}

.p9{
    transform:
        rotate(288deg)
        translateY(-145%);
}

.p10{
    transform:
        rotate(324deg)
        translateY(-145%);
}


/* =====================================================
   CENTER LOGO
===================================================== */

.center-logo{

    position:absolute;

    width:
        clamp(95px,10vw,140px);

    height:
        clamp(95px,10vw,140px);

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:#fff;

    border:
        7px solid #050505;

    box-shadow:

        0 0 0 5px #e00000,

        0 8px 25px
        rgba(0,0,0,.9);

    z-index:60;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;
}


.center-logo img{

    width:88%;
    height:88%;

    object-fit:contain;
}


/* =====================================================
   RIGHT SIDE
===================================================== */

.right-area{

    height:100%;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;
}


/* =====================================================
   RESULT
===================================================== */

.result-box{

    width:100%;

    max-width:280px;

    padding:24px 18px;

    background:

        linear-gradient(
            145deg,
            #1c1c1c,
            #090909
        );

    border:
        1px solid #3a3a3a;

    border-right:
        4px solid #e00000;

    box-shadow:

        0 8px 25px
        rgba(0,0,0,.4);
}


.result-title{

    color:#999;

    font-size:14px;

    margin-bottom:10px;
}


.result{

    min-height:35px;

    color:#e00000;

    font-size:22px;

    font-weight:900;

    line-height:1.4;
}


.instructions{

    max-width:280px;

    margin-top:20px;

    padding:14px;

    color:#ccc;

    background:#101010;

    border:
        1px solid #292929;

    font-size:13px;

    line-height:1.7;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    position:absolute;

    z-index:50;

    bottom:22px;

    left:50%;

    transform:
        translateX(-50%);

    white-space:nowrap;

    color:#aaa;

    font-size:12px;
}


.footer-red{
    color:#e00000;
    font-weight:bold;
}


/* =====================================================
   WIN ANIMATION
===================================================== */

.winner{

    animation:
        winnerAnimation
        .7s ease;
}


@keyframes winnerAnimation{

    0%{
        transform:scale(1);
    }

    30%{
        transform:scale(1.04);
    }

    60%{
        transform:scale(.98);
    }

    100%{
        transform:scale(1);
    }
}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:1100px){

    .content{

        grid-template-columns:
            .8fr
            1.4fr
            .7fr;

        padding:
            40px 48px;
    }

    .wheel-area{

        width:
            min(44vw,470px);
    }

    .prize img{

        width:65px;
        height:65px;
    }

    .center-logo{

        width:105px;
        height:105px;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .screen{
        padding:7px;
    }

    .frame{

        width:100vw;

        height:
            calc(100vh - 14px);
    }

    .content{

        display:flex;

        flex-direction:column;

        justify-content:flex-start;

        gap:0;

        padding:
            25px 25px 18px;
    }


    /* HEADER */

    .left-area{

        width:100%;

        height:auto;

        flex-shrink:0;
    }

    .logo-top{

        width:45px;
        height:45px;

        margin-bottom:4px;
    }

    .title{

        font-size:28px;
    }

    .title-line{

        width:55px;
        height:3px;

        margin:
            7px auto;
    }

    .subtitle{

        font-size:12px;

        line-height:1.45;
    }

    .exclusive{

        font-size:10px;

        margin-top:2px;
    }


    /* BUTTON */

    .spin-button{

        margin-top:8px;

        min-width:175px;

        padding:
            8px 20px;

        font-size:17px;
    }

    .arrow{
        font-size:19px;
    }


    /* WHEEL */

    .center-area{

        width:100%;

        flex:1;

        min-height:0;

        height:auto;
    }

    .wheel-area{

        width:
            min(
                58vh,
                84vw
            );

        max-width:430px;
    }


    .prize img{

        width:
            clamp(
                42px,
                11vw,
                65px
            );

        height:
            clamp(
                42px,
                11vw,
                65px
            );
    }

    .center-logo{

        width:85px;
        height:85px;

        border-width:5px;
    }


    /* RESULT */

    .right-area{

        position:absolute;

        right:18px;

        bottom:45px;

        height:auto;
    }

    .result-box,
    .instructions{

        display:none;
    }


    /* FOOTER */

    .footer{

        bottom:10px;

        font-size:8px;
    }


    .side-line{

        top:75px;
        bottom:65px;
    }

}


/* =====================================================
   SHORT MOBILE
===================================================== */

@media(
    max-width:700px
) and (
    max-height:650px
){

    .content{

        padding-top:18px;
    }

    .logo-top{

        width:35px;
        height:35px;
    }

    .title{

        font-size:24px;
    }

    .subtitle{

        font-size:10px;
    }

    .exclusive{

        font-size:9px;
    }

    .spin-button{

        margin-top:5px;

        padding:6px 18px;

        font-size:15px;
    }

    .wheel-area{

        width:
            min(
                56vh,
                78vw
            );
    }

    .center-logo{

        width:72px;
        height:72px;
    }

    .prize img{

        width:45px;
        height:45px;
    }
}


/* =====================================================
   LANDSCAPE MOBILE
===================================================== */

@media(
    max-height:550px
) and (
    orientation:landscape
){

    .content{

        display:grid;

        grid-template-columns:
            .85fr
            1.5fr
            .7fr;

        padding:
            25px 45px;
    }

    .logo-top{

        width:42px;
        height:42px;
    }

    .title{

        font-size:26px;
    }

    .subtitle{

        font-size:11px;
    }

    .exclusive{

        font-size:9px;
    }

    .spin-button{

        margin-top:7px;

        padding:7px 18px;

        font-size:14px;
    }

    .wheel-area{

        width:
            min(
                72vh,
                43vw
            );
    }

    .center-logo{

        width:75px;
        height:75px;
    }

    .prize img{

        width:50px;
        height:50px;
    }

    .footer{

        bottom:8px;

        font-size:8px;
    }
}


/* =====================================================
   NO SELECT
===================================================== */

button,
img{

    user-select:none;

    -webkit-user-select:none;

    -webkit-tap-highlight-color:
        transparent;
}

</style>

</head>

const prizes = [

];


/* =====================================================
   ROTATION
===================================================== */

let currentRotation = 0;

let spinning = false;


/* =====================================================
   SPIN
===================================================== */

function spinWheel(){

    if(spinning){
        return;
    }


    spinning = true;


    const wheel =
        document.getElementById(
            "wheel"
        );


    const button =
        document.getElementById(
            "spinButton"
        );


    const result =
        document.getElementById(
            "result"
        );


    const wheelArea =
        document.getElementById(
            "wheelArea"
        );


    button.disabled = true;


    result.innerHTML =
        "الرولة تدور...";


    /* ==============================================
       اختيار جائزة عشوائية
    ============================================== */

    const randomIndex =
        Math.floor(
            Math.random() *
            prizes.length
        );


    /* ==============================================
       كل خانة = 36 درجة
    ============================================== */

    const sectorAngle = 36;


    /*
       نخلي منتصف الخانة
       مقابل السهم
    */

    const prizeAngle =
        randomIndex *
        sectorAngle +
        18;


    /*
       دورات كاملة إضافية
    */

    const fullSpins =
        360 * 7;


    /*
       زاوية التوقف
    */

    const finalRotation =
        currentRotation +
        fullSpins +
        (360 - prizeAngle);


    currentRotation =
        finalRotation;


    /*
       تشغيل الرولة
    */

    wheel.style.transform =
        "rotate(" +
        finalRotation +
        "deg)";


    /* ==============================================
       بعد انتهاء الدوران
    ============================================== */

    setTimeout(function(){


        result.innerHTML =
            "🎉 الجائزة رقم " +
            (randomIndex + 1);


        wheelArea.classList.add(
            "winner"
        );


        setTimeout(function(){

            wheelArea.classList.remove(
                "winner"
            );

        },700);


        spinning = false;

        button.disabled = false;


    },5600);

}


/* =====================================================
   PRELOAD IMAGES
===================================================== */

window.addEventListener(
    "load",
    function(){

        prizes.forEach(
            function(image){

                const img =
                    new Image();

                img.src = image;

            }
        );

    }
);

</script>
