<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فؤاد فون | اضغط واربح</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        "Tajawal",
        "Cairo",
        Tahoma,
        Arial,
        sans-serif;

    background:#02050a;
    color:#fff;
}


/* =====================================================
   PAGE
===================================================== */

.page{
    width:100vw;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            #07111c 0%,
            #03070c 55%,
            #010204 100%
        );
}


/* =====================================================
   FRAME
===================================================== */

.frame{
    position:relative;

    width:96vw;
    height:94vh;

    max-width:1550px;

    background:
        linear-gradient(
            135deg,
            #020406,
            #05080d 50%,
            #020406
        );

    border:2px solid #17212c;

    box-shadow:
        0 0 0 3px #010204,
        0 0 45px rgba(0,90,150,.25);

    overflow:hidden;
}


/* =====================================================
   INNER FRAME
===================================================== */

.frame:before{
    content:"";

    position:absolute;

    inset:12px;

    border:1px solid #182632;

    pointer-events:none;

    z-index:30;
}


/* =====================================================
   BLUE CORNERS
===================================================== */

.corner{
    position:absolute;

    width:130px;
    height:5px;

    background:#075b91;

    box-shadow:
        0 0 12px #008cff;

    z-index:40;
}

.c1{
    top:22px;
    left:28px;
}

.c2{
    top:22px;
    right:28px;
}

.c3{
    bottom:22px;
    left:28px;
}

.c4{
    bottom:22px;
    right:28px;
}


.corner-v{
    position:absolute;

    width:5px;
    height:90px;

    background:#075b91;

    box-shadow:
        0 0 12px #008cff;

    z-index:40;
}

.cv1{
    top:22px;
    left:28px;
}

.cv2{
    top:22px;
    right:28px;
}

.cv3{
    bottom:22px;
    left:28px;
}

.cv4{
    bottom:22px;
    right:28px;
}


/* =====================================================
   CONTENT
===================================================== */

.content{
    position:relative;

    width:100%;
    height:100%;

    z-index:10;

    display:grid;

    grid-template-columns:
        280px
        minmax(500px,1fr)
        240px;

    align-items:center;

    gap:15px;

    padding:45px 60px;
}


/* =====================================================
   LEFT
===================================================== */

.left{
    height:100%;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;
}


/* =====================================================
   LOGO
===================================================== */

.top-logo{
    width:75px;
    height:75px;

    object-fit:contain;

    margin-bottom:10px;
}


/* =====================================================
   TITLE
===================================================== */

.title{
    font-size:52px;

    font-weight:900;

    color:#fff;

    letter-spacing:-1px;

    text-shadow:
        0 4px 15px #000;
}


.red-line{
    width:80px;
    height:4px;

    margin:12px auto;

    background:#0877bd;

    box-shadow:
        0 0 12px #008cff;
}


.subtitle{
    font-size:19px;

    font-weight:bold;

    line-height:1.7;
}

.red{
    color:#1599e8;
}


.exclusive{
    margin-top:5px;

    color:#c5cbd1;

    font-size:15px;

    line-height:1.7;
}


/* =====================================================
   BUTTON
===================================================== */

.spin-button{
    margin-top:30px;

    width:210px;

    padding:15px;

    border:none;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #0879bd,
            #043d68
        );

    color:white;

    font-family:inherit;

    font-size:21px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 8px 25px rgba(0,120,210,.35);

    transition:.2s;
}

.spin-button:hover{
    transform:translateY(-3px);

    box-shadow:
        0 12px 35px rgba(0,150,255,.5);
}

.spin-button:active{
    transform:scale(.95);
}

.spin-button:disabled{
    opacity:.5;
    cursor:not-allowed;
}


/* =====================================================
   CENTER
===================================================== */

.center{
    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;
}


/* =====================================================
   WHEEL AREA
===================================================== */

.wheel-area{
    position:relative;

    width:min(48vw,600px);

    aspect-ratio:1;
}


/* =====================================================
   POINTER
===================================================== */

.pointer{
    position:absolute;

    z-index:100;

    top:-5px;
    left:50%;

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:25px solid transparent;
    border-right:25px solid transparent;

    border-top:65px solid #087dca;

    filter:
        drop-shadow(
            0 4px 5px #000
        );
}

.pointer:after{
    content:"";

    position:absolute;

    left:-10px;
    top:-58px;

    width:20px;
    height:20px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 0 4px #071018;
}


/* =====================================================
   OUTER GLOW
===================================================== */

.wheel-glow{
    position:absolute;

    inset:-12px;

    border-radius:50%;

    border:4px solid #087dcc;

    box-shadow:

        0 0 10px #008cff,
        0 0 25px rgba(0,130,220,.8),
        0 0 55px rgba(0,120,220,.3);

    pointer-events:none;

    z-index:20;
}


/* =====================================================
   WHEEL
===================================================== */

.wheel{
    position:absolute;

    inset:0;

    border-radius:50%;

    overflow:hidden;

    border:
        8px solid #080b0f;

    background:#111;

    box-shadow:

        0 0 0 3px #59636d,
        0 15px 40px #000;

    transition:
        transform
        5.5s
        cubic-bezier(.12,.75,.12,1);

    z-index:5;
}


/* =====================================================
   SECTORS
   كل خانة 36 درجة
   أصفر + أزرق چويتي
===================================================== */

.sectors{
    position:absolute;

    inset:0;

    border-radius:50%;

    background:
        conic-gradient(

            #f3c400 0deg 36deg,
            #073f67 36deg 72deg,

            #f3c400 72deg 108deg,
            #073f67 108deg 144deg,

            #f3c400 144deg 180deg,
            #073f67 180deg 216deg,

            #f3c400 216deg 252deg,
            #073f67 252deg 288deg,

            #f3c400 288deg 324deg,
            #073f67 324deg 360deg
        );
}


/* =====================================================
   SECTOR LINES
===================================================== */

.sector-lines{
    position:absolute;

    inset:0;

    border-radius:50%;

    background:
        repeating-conic-gradient(
            from -18deg,

            transparent 0deg 35deg,

            rgba(255,255,255,.8)
            35deg 36deg
        );

    z-index:2;
}


/* =====================================================
   PRIZES
===================================================== */

.prize{
    position:absolute;

    width:36%;
    height:36%;

    left:32%;
    top:32%;

    z-index:8;

    transform-origin:center;
}


/*
   الصورة داخل مركز الخانة
   مرفوعة للأعلى
*/

.prize img{

    position:absolute;

    width:112px;
    height:112px;

    max-width:none;

    object-fit:contain;

    left:50%;
    top:-103px;

    transform:
        translateX(-50%);

    filter:
        drop-shadow(
            0 4px 5px rgba(0,0,0,.85)
        );

    background:transparent;

    border-radius:8px;
}


/* =====================================================
   حظ أوفر
   بدون صورة
   بدون ظل
===================================================== */

.no-prize{
    position:absolute;

    width:36%;
    height:36%;

    left:32%;
    top:32%;

    z-index:9;

    transform-origin:center;

    display:flex;

    align-items:flex-start;
    justify-content:center;
}


.no-prize span{

    position:absolute;

    top:-58px;

    width:130px;

    text-align:center;

    white-space:nowrap;

    color:#111827;

    font-size:19px;

    font-weight:900;

    line-height:1.2;

    text-shadow:none;

    filter:none;

    transform:
        translateX(-50%);

    left:50%;
}


/* =====================================================
   POSITIONS
===================================================== */

.p1{
    transform:rotate(0deg);
}

.p2{
    transform:rotate(36deg);
}

.p3{
    transform:rotate(72deg);
}

.p4{
    transform:rotate(108deg);
}

.p5{
    transform:rotate(144deg);
}

.p6{
    transform:rotate(180deg);
}

.p7{
    transform:rotate(216deg);
}

.p8{
    transform:rotate(252deg);
}

.p9{
    transform:rotate(288deg);
}

.p10{
    transform:rotate(324deg);
}


/* =====================================================
   CENTER LOGO
===================================================== */

.center-logo{

    position:absolute;

    z-index:50;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:145px;
    height:145px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #17212a,
            #03070b
        );

    border:
        5px solid #087dcc;

    box-shadow:

        0 0 0 5px #050505,
        0 0 25px rgba(0,140,240,.8);

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.center-logo img{

    width:88%;
    height:88%;

    object-fit:contain;
}


/* =====================================================
   RIGHT
===================================================== */

.right{

    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;
}


/* =====================================================
   RESULT BOX
===================================================== */

.result-box{

    width:220px;

    min-height:270px;

    padding:22px 18px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            #07131e,
            #02070c
        );

    border:
        1px solid #23435a;

    border-top:
        4px solid #087dcc;

    box-shadow:
        0 10px 35px rgba(0,0,0,.7);
}


/* صورة النتيجة */

.result-image{

    width:100px;
    height:100px;

    object-fit:contain;

    margin-bottom:10px;

    display:none;
}


/* حظ أوفر بالنتيجة */

.result-no-prize{

    color:#f3c400;

    font-size:25px;

    font-weight:900;

    margin-bottom:10px;

    display:none;

    text-shadow:none;
}


.result-title{

    color:#9daab5;

    font-size:15px;

    margin-bottom:12px;
}


.result{

    color:#f3c400;

    font-size:22px;

    font-weight:900;

    line-height:1.5;
}


.help{

    margin-top:15px;

    color:#9daab5;

    font-size:12px;

    line-height:1.7;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    position:absolute;

    z-index:60;

    bottom:17px;

    left:50%;

    transform:translateX(-50%);

    white-space:nowrap;

    font-size:12px;

    color:#b9c0c6;
}

.footer span{
    color:#1599e8;
    font-weight:bold;
}


/* =====================================================
   WIN
===================================================== */

.winner{
    animation:
        winner .7s ease;
}

@keyframes winner{

    0%{
        transform:scale(1);
    }

    40%{
        transform:scale(1.03);
    }

    70%{
        transform:scale(.98);
    }

    100%{
        transform:scale(1);
    }
}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:1150px){

    .content{

        grid-template-columns:
            230px
            minmax(430px,1fr)
            190px;

        padding:
            40px 45px;
    }

    .title{
        font-size:42px;
    }

    .subtitle{
        font-size:15px;
    }

    .exclusive{
        font-size:13px;
    }

    .wheel-area{
        width:min(47vw,500px);
    }

    .prize img{
        width:90px;
        height:90px;
        top:-83px;
    }

    .no-prize span{
        top:-50px;
        font-size:16px;
    }

    .center-logo{
        width:120px;
        height:120px;
    }

    .result-box{
        width:180px;
        min-height:220px;
    }

    .result-image{
        width:80px;
        height:80px;
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .frame{

        width:100vw;
        height:100vh;

        border:none;
    }

    .content{

        display:flex;

        flex-direction:column;

        padding:
            18px 20px 10px;

        gap:0;
    }


    .left{

        height:auto;

        flex-shrink:0;
    }


    .top-logo{

        width:40px;
        height:40px;

        margin-bottom:2px;
    }


    .title{
        font-size:27px;
    }


    .red-line{
        width:55px;
        height:3px;
        margin:5px auto;
    }


    .subtitle{
        font-size:11px;
        line-height:1.5;
    }


    .exclusive{
        font-size:9px;
        margin-top:1px;
    }


    .spin-button{

        margin-top:8px;

        width:170px;

        padding:8px;

        font-size:16px;
    }


    .center{

        width:100%;

        flex:1;

        min-height:0;
    }


    .wheel-area{

        width:
            min(
                68vh,
                88vw
            );
    }


    .prize img{

        width:
            clamp(
                65px,
                16vw,
                88px
            );

        height:
            clamp(
                65px,
                16vw,
                88px
            );

        top:
            clamp(
                -78px,
                -12vw,
                -62px
            );
    }


    .no-prize span{

        top:
            clamp(
                -52px,
                -8vw,
                -42px
            );

        font-size:
            clamp(
                13px,
                4vw,
                17px
            );
    }


    .center-logo{

        width:82px;
        height:82px;

        border-width:4px;
    }


    .right{
        display:none;
    }


    .footer{

        bottom:7px;

        font-size:8px;
    }


    .corner{
        width:70px;
        height:3px;
    }


    .corner-v{
        width:3px;
        height:50px;
    }
}


/* =====================================================
   VERY SHORT MOBILE
===================================================== */

@media(
    max-width:700px
) and (
    max-height:650px
){

    .content{
        padding-top:10px;
    }

    .top-logo{
        width:30px;
        height:30px;
    }

    .title{
        font-size:22px;
    }

    .subtitle{
        font-size:9px;
    }

    .exclusive{
        font-size:8px;
    }

    .spin-button{
        margin-top:4px;
        padding:5px;
        font-size:13px;
    }

    .wheel-area{
        width:
            min(
                60vh,
                80vw
            );
    }

    .center-logo{
        width:68px;
        height:68px;
    }

    .prize img{
        width:55px;
        height:55px;
        top:-55px;
    }

    .no-prize span{
        top:-40px;
        font-size:12px;
    }
}


/* =====================================================
   LANDSCAPE MOBILE
===================================================== */

@media(
    max-height:550px
) and (
    orientation:landscape
){

    .content{

        display:grid;

        grid-template-columns:
            220px
            1fr
            180px;

        padding:
            25px 45px;
    }

    .title{
        font-size:28px;
    }

    .subtitle{
        font-size:11px;
    }

    .exclusive{
        font-size:9px;
    }

    .spin-button{
        margin-top:7px;
        padding:7px;
        font-size:14px;
    }

    .wheel-area{
        width:
            min(
                72vh,
                44vw
            );
    }

    .center-logo{
        width:80px;
        height:80px;
    }

    .prize img{
        width:65px;
        height:65px;
        top:-62px;
    }

    .no-prize span{
        top:-45px;
        font-size:13px;
    }

    .result-box{
        width:160px;
        min-height:180px;
    }

    .result-image{
        width:65px;
        height:65px;
    }

    .footer{
        font-size:8px;
    }
}

</style>
</head>

/* =====================================================
   إعدادات الاحتمالات

   F_3 = index 2
   F_5 = index 4
   F_1 = index 0

   هذه الجوائز تكون نادرة.
===================================================== */

const rareRules = {

    2: 20,   // F_3
    4: 15,   // F_5
    0: 10    // F_1 / حظ أوفر
};


/* =====================================================
   عداد السحبات
===================================================== */

let spinCount = 0;

let currentRotation = 0;

let spinning = false;


/* =====================================================
   اختيار الجائزة

   الجوائز العادية تظهر بشكل طبيعي.
   الجوائز النادرة تقل احتمالية ظهورها.
===================================================== */

function choosePrize(){

    const random =
        Math.random();

    /*
       احتمال F_3
       تقريباً 1 من 20
    */

    if(
        Math.random() < 1 / 20
    ){

        return 2;

    }


    /*
       احتمال F_5
       تقريباً 1 من 15
    */

    if(
        Math.random() < 1 / 15
    ){

        return 4;

    }


    /*
       احتمال F_1 / حظ أوفر
       تقريباً 1 من 10
    */

    if(
        Math.random() < 1 / 10
    ){

        return 0;

    }


    /*
       باقي الجوائز

       نستبعد الجوائز النادرة
       حتى لا تزيد فرصتها.
    */

    const normalIndexes = [

        1,
        3,
        5,
        6,
        7,
        8,
        9

    ];


    return normalIndexes[
        Math.floor(
            Math.random() *
            normalIndexes.length
        )
    ];

}


/* =====================================================
   SPIN
===================================================== */

function spinWheel(){

    if(spinning){
        return;
    }


    spinning = true;


    const wheel =
        document.getElementById("wheel");


    const button =
        document.getElementById("spinButton");


    const result =
        document.getElementById("result");


    const wheelArea =
        document.getElementById("wheelArea");


    const resultImage =
        document.getElementById("resultImage");


    const resultNoPrize =
        document.getElementById("resultNoPrize");


    button.disabled = true;


    /*
       نخفي نتيجة السحبة السابقة
    */

    resultImage.style.display =
        "none";

    resultNoPrize.style.display =
        "none";


    result.innerHTML =
        "الرولة تدور...";


    /*
       عداد السحبات
    */

    spinCount++;


    /*
       اختيار الجائزة
    */

    const selected =
        choosePrize();


    /*
       كل خانة = 36 درجة

       مهم جداً:

       الصور موجودة في منتصف الخانة
       لذلك نستخدم مركز الخانة:

       0
       36
       72
       108
       ...
    */

    const sector = 36;

    const target =
        selected * sector;


    /*
       نعرف وضع الرولة الحالي
       حتى لا يصير اختلاف بالنتيجة
    */

    const currentMod =
        ((currentRotation % 360) + 360) % 360;


    /*
       مقدار الدوران المطلوب
       حتى مركز الجائزة المختارة
       يوصل بالضبط إلى السهم.
    */

    let correction =
        (360 - ((target + currentMod) % 360)) % 360;


    /*
       دورات كاملة
    */

    const extra =
        360 * 7;


    const finalRotation =
        currentRotation +
        extra +
        correction;


    currentRotation =
        finalRotation;


    /*
       تدوير الرولة
    */

    wheel.style.transform =
        `rotate(${finalRotation}deg)`;


    /*
       ننتظر انتهاء الدوران
    */

    setTimeout(function(){

        const prize =
            prizes[selected];


        /*
           إذا كانت حظ أوفر
        */

        if(prize.lose){

            resultImage.style.display =
                "none";


            resultNoPrize.style.display =
                "block";


            result.innerHTML =
                "حاول مرة ثانية ❤️";

        }

        else{

            /*
               عرض صورة الجائزة
            */

            resultImage.src =
                prize.image;


            resultImage.style.display =
                "block";


            resultNoPrize.style.display =
                "none";


            result.innerHTML =
                "🎉 مبروك!<br>" +
                prize.name;

        }


        /*
           تأثير الفوز
        */

        wheelArea.classList.add(
            "winner"
        );


        setTimeout(function(){

            wheelArea.classList.remove(
                "winner"
            );

        },700);


        spinning = false;

        button.disabled = false;


    },5600);

}
