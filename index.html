<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>فؤاد فون | اضغط واربح</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:#030405;

    color:#fff;
}


/* =====================================================
   PAGE
===================================================== */

.page{

    width:100vw;
    height:100vh;

    display:flex;

    align-items:center;
    justify-content:center;

    background:

        radial-gradient(
            circle at center,
            #111827 0%,
            #07090d 50%,
            #020202 100%
        );
}


/* =====================================================
   FRAME
===================================================== */

.frame{

    position:relative;

    width:96vw;
    height:94vh;

    max-width:1550px;

    background:

        linear-gradient(
            135deg,
            #020305,
            #080b10 50%,
            #020305
        );

    border:
        2px solid #182334;

    box-shadow:

        0 0 0 3px #010101,

        0 0 45px
        rgba(0,100,255,.25);

    overflow:hidden;
}


/* =====================================================
   INNER FRAME
===================================================== */

.frame::before{

    content:"";

    position:absolute;

    inset:12px;

    border:
        1px solid #26364c;

    pointer-events:none;

    z-index:30;
}


/* =====================================================
   CORNERS
===================================================== */

.corner{

    position:absolute;

    width:130px;
    height:5px;

    background:#087cff;

    box-shadow:
        0 0 12px #087cff;

    z-index:40;
}

.c1{
    top:22px;
    left:28px;
}

.c2{
    top:22px;
    right:28px;
}

.c3{
    bottom:22px;
    left:28px;
}

.c4{
    bottom:22px;
    right:28px;
}


.corner-v{

    position:absolute;

    width:5px;
    height:90px;

    background:#087cff;

    box-shadow:
        0 0 12px #087cff;

    z-index:40;
}

.cv1{
    top:22px;
    left:28px;
}

.cv2{
    top:22px;
    right:28px;
}

.cv3{
    bottom:22px;
    left:28px;
}

.cv4{
    bottom:22px;
    right:28px;
}


/* =====================================================
   CONTENT
===================================================== */

.content{

    position:relative;

    width:100%;
    height:100%;

    z-index:10;

    display:grid;

    grid-template-columns:
        280px
        minmax(500px,1fr)
        240px;

    align-items:center;

    gap:15px;

    padding:
        45px 60px;
}


/* =====================================================
   LEFT
===================================================== */

.left{

    height:100%;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;
}


/* =====================================================
   TOP LOGO
===================================================== */

.top-logo{

    width:75px;
    height:75px;

    object-fit:contain;

    margin-bottom:10px;
}


/* =====================================================
   TITLE
===================================================== */

.title{

    font-size:52px;

    font-weight:900;

    color:#fff;

    text-shadow:
        0 4px 15px #000;
}

.blue-line{

    width:80px;
    height:4px;

    margin:
        12px auto;

    background:#087cff;

    box-shadow:
        0 0 12px #087cff;
}

.subtitle{

    font-size:19px;

    font-weight:bold;

    line-height:1.7;
}

.blue{

    color:#1688ff;
}

.exclusive{

    margin-top:5px;

    color:#ddd;

    font-size:15px;

    line-height:1.7;
}


/* =====================================================
   BUTTON
===================================================== */

.spin-button{

    margin-top:30px;

    width:210px;

    padding:15px;

    border:none;

    border-radius:10px;

    background:

        linear-gradient(
            135deg,
            #1688ff,
            #004caa
        );

    color:#fff;

    font-family:inherit;

    font-size:21px;

    font-weight:900;

    cursor:pointer;

    box-shadow:

        0 8px 25px
        rgba(0,100,255,.40);

    transition:.2s;
}

.spin-button:hover{

    transform:
        translateY(-3px);

    box-shadow:

        0 12px 35px
        rgba(0,120,255,.60);
}

.spin-button:active{

    transform:
        scale(.95);
}

.spin-button:disabled{

    opacity:.5;

    cursor:not-allowed;
}


/* =====================================================
   CENTER
===================================================== */

.center{

    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;
}


/* =====================================================
   WHEEL AREA
===================================================== */

.wheel-area{

    position:relative;

    width:
        min(48vw,600px);

    aspect-ratio:1;
}


/* =====================================================
   POINTER
===================================================== */

.pointer{

    position:absolute;

    z-index:100;

    top:-4px;

    left:50%;

    transform:
        translateX(-50%);

    width:0;
    height:0;

    border-left:
        25px solid transparent;

    border-right:
        25px solid transparent;

    border-top:
        65px solid #087cff;

    filter:
        drop-shadow(
            0 4px 5px #000
        );
}

.pointer::after{

    content:"";

    position:absolute;

    left:-10px;

    top:-58px;

    width:20px;
    height:20px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 0 4px #111;
}


/* =====================================================
   WHEEL GLOW
===================================================== */

.wheel-glow{

    position:absolute;

    inset:-12px;

    border-radius:50%;

    border:
        4px solid #087cff;

    box-shadow:

        0 0 10px #087cff,

        0 0 25px
        rgba(0,110,255,.8),

        0 0 55px
        rgba(0,110,255,.35);

    pointer-events:none;

    z-index:20;
}


/* =====================================================
   WHEEL
===================================================== */

.wheel{

    position:absolute;

    inset:0;

    border-radius:50%;

    overflow:hidden;

    border:
        8px solid #080808;

    background:#111;

    box-shadow:

        0 0 0 3px #777,

        0 15px 40px #000;

    transition:

        transform
        5.5s
        cubic-bezier(.12,.75,.12,1);

    z-index:5;
}


/* =====================================================
   SECTORS
===================================================== */

/*
   كل خانة لون كامل.
   ماكو خانة تنقسم نصين.

   F1  = أصفر
   F2  = أزرق
   F3  = أصفر
   F4  = أزرق
   F5  = أصفر
   F6  = أزرق
   F7  = أصفر
   F8  = أزرق
   F9  = أصفر
   F10 = أزرق
*/

.sectors{

    position:absolute;

    inset:0;

    border-radius:50%;

    background:

        conic-gradient(

            #ffd900 0deg 36deg,

            #1769d1 36deg 72deg,

            #ffd900 72deg 108deg,

            #1769d1 108deg 144deg,

            #ffd900 144deg 180deg,

            #1769d1 180deg 216deg,

            #ffd900 216deg 252deg,

            #1769d1 252deg 288deg,

            #ffd900 288deg 324deg,

            #1769d1 324deg 360deg
        );
}


/* =====================================================
   SECTOR LINES
===================================================== */

.sector-lines{

    position:absolute;

    inset:0;

    border-radius:50%;

    background:

        repeating-conic-gradient(

            from -18deg,

            transparent 0deg 35deg,

            rgba(255,255,255,.8)
            35deg 36deg
        );

    z-index:2;
}


/* =====================================================
   PRIZE CONTAINER
===================================================== */

.prize{

    position:absolute;

    width:36%;
    height:36%;

    left:32%;
    top:32%;

    z-index:8;

    transform-origin:center;
}


/* =====================================================
   PRODUCT IMAGES
===================================================== */

/*
   رفعت الصور للأعلى بشكل واضح.
   الصورة تبقى داخل خانتها وما تعبر للخانة الثانية.
*/

.prize img{

    position:absolute;

    width:115px;
    height:115px;

    max-width:none;

    object-fit:contain;

    left:50%;

    top:-112px;

    transform:
        translateX(-50%);

    filter:
        drop-shadow(
            0 6px 7px
            rgba(0,0,0,.85)
        );

    background:transparent;

    border-radius:10px;

    display:block;
}


/* =====================================================
   POSITIONS
===================================================== */

.p1{
    transform:rotate(0deg);
}

.p2{
    transform:rotate(36deg);
}

.p3{
    transform:rotate(72deg);
}

.p4{
    transform:rotate(108deg);
}

.p5{
    transform:rotate(144deg);
}

.p6{
    transform:rotate(180deg);
}

.p7{
    transform:rotate(216deg);
}

.p8{
    transform:rotate(252deg);
}

.p9{
    transform:rotate(288deg);
}

.p10{
    transform:rotate(324deg);
}


/* =====================================================
   LUCKY TEXT
===================================================== */

.lucky-text{

    position:absolute;

    width:100px;

    left:50%;

    top:-105px;

    transform:
        translateX(-50%);

    color:#111;

    font-size:22px;

    font-weight:900;

    text-align:center;

    white-space:nowrap;

    text-shadow:none;
}


/* =====================================================
   CENTER LOGO
===================================================== */

.center-logo{

    position:absolute;

    z-index:50;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:145px;
    height:145px;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            #181818,
            #030303
        );

    border:
        5px solid #087cff;

    box-shadow:

        0 0 0 5px #050505,

        0 0 25px
        rgba(0,110,255,.8);

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.center-logo img{

    width:88%;
    height:88%;

    object-fit:contain;
}


/* =====================================================
   RIGHT
===================================================== */

.right{

    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;
}


/* =====================================================
   RESULT BOX
===================================================== */

.result-box{

    width:220px;

    min-height:250px;

    padding:
        22px 18px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    background:

        linear-gradient(
            145deg,
            #11151c,
            #050608
        );

    border:
        1px solid #26364d;

    border-top:
        4px solid #087cff;

    box-shadow:

        0 10px 35px
        rgba(0,0,0,.6);
}


/* =====================================================
   RESULT TITLE
===================================================== */

.result-title{

    color:#aaa;

    font-size:15px;

    margin-bottom:12px;
}


/* =====================================================
   RESULT CONTENT
===================================================== */

.result{

    width:100%;

    color:#1688ff;

    font-size:24px;

    font-weight:900;

    line-height:1.5;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;
}


/* =====================================================
   RESULT IMAGE
===================================================== */

.result img{

    width:105px;
    height:105px;

    object-fit:contain;

    margin-bottom:8px;

    filter:
        drop-shadow(
            0 5px 8px
            rgba(0,0,0,.8)
        );
}


/* =====================================================
   LUCKY RESULT
===================================================== */

.lucky-result{

    color:#1688ff;

    font-size:30px;

    font-weight:900;

    text-shadow:none;
}


/* =====================================================
   HELP
===================================================== */

.help{

    margin-top:15px;

    color:#bbb;

    font-size:12px;

    line-height:1.7;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    position:absolute;

    z-index:60;

    bottom:17px;

    left:50%;

    transform:
        translateX(-50%);

    white-space:nowrap;

    font-size:12px;

    color:#ccc;
}

.footer span{

    color:#1688ff;

    font-weight:bold;
}


/* =====================================================
   WIN ANIMATION
===================================================== */

.winner{

    animation:
        winner .7s ease;
}

@keyframes winner{

    0%{
        transform:scale(1);
    }

    40%{
        transform:scale(1.03);
    }

    70%{
        transform:scale(.98);
    }

    100%{
        transform:scale(1);
    }
}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:1150px){

    .content{

        grid-template-columns:
            230px
            minmax(430px,1fr)
            190px;

        padding:
            40px 45px;
    }

    .title{
        font-size:42px;
    }

    .subtitle{
        font-size:15px;
    }

    .exclusive{
        font-size:13px;
    }

    .wheel-area{

        width:
            min(47vw,500px);
    }

    .prize img{

        width:90px;
        height:90px;

        top:-88px;
    }

    .lucky-text{

        font-size:18px;

        top:-84px;
    }

    .center-logo{

        width:120px;
        height:120px;
    }

    .result-box{

        width:180px;

        min-height:210px;
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .frame{

        width:100vw;
        height:100vh;

        border:none;
    }

    .content{

        display:flex;

        flex-direction:column;

        padding:
            18px 20px 10px;

        gap:0;
    }


    .left{

        height:auto;

        flex-shrink:0;
    }


    .top-logo{

        width:40px;
        height:40px;

        margin-bottom:2px;
    }


    .title{

        font-size:27px;
    }


    .blue-line{

        width:55px;
        height:3px;

        margin:5px auto;
    }


    .subtitle{

        font-size:11px;

        line-height:1.5;
    }


    .exclusive{

        font-size:9px;

        margin-top:1px;
    }


    .spin-button{

        margin-top:8px;

        width:170px;

        padding:8px;

        font-size:16px;
    }


    .center{

        width:100%;

        flex:1;

        min-height:0;
    }


    .wheel-area{

        width:
            min(
                68vh,
                88vw
            );
    }


    .prize img{

        width:
            clamp(
                58px,
                15vw,
                85px
            );

        height:
            clamp(
                58px,
                15vw,
                85px
            );

        top:
            clamp(
                -78px,
                -13vw,
                -60px
            );
    }


    .lucky-text{

        font-size:
            clamp(
                14px,
                4vw,
                21px
            );

        top:
            clamp(
                -68px,
                -12vw,
                -52px
            );
    }


    .center-logo{

        width:82px;
        height:82px;

        border-width:4px;
    }


    .right{

        display:none;
    }


    .footer{

        bottom:7px;

        font-size:8px;
    }


    .corner{

        width:70px;
        height:3px;
    }


    .corner-v{

        width:3px;
        height:50px;
    }
}


/* =====================================================
   VERY SHORT MOBILE
===================================================== */

@media(
    max-width:700px
) and (
    max-height:650px
){

    .content{

        padding-top:10px;
    }


    .top-logo{

        width:30px;
        height:30px;
    }


    .title{

        font-size:22px;
    }


    .subtitle{

        font-size:9px;
    }


    .exclusive{

        font-size:8px;
    }


    .spin-button{

        margin-top:4px;

        padding:5px;

        font-size:13px;
    }


    .wheel-area{

        width:
            min(
                60vh,
                80vw
            );
    }


    .center-logo{

        width:68px;
        height:68px;
    }


    .prize img{

        width:48px;
        height:48px;

        top:-52px;
    }


    .lucky-text{

        font-size:14px;

        top:-47px;
    }
}


/* =====================================================
   LANDSCAPE MOBILE
===================================================== */

@media(
    max-height:550px
) and (
    orientation:landscape
){

    .content{

        display:grid;

        grid-template-columns:
            220px
            1fr
            180px;

        padding:
            25px 45px;
    }


    .title{

        font-size:28px;
    }


    .subtitle{

        font-size:11px;
    }


    .exclusive{

        font-size:9px;
    }


    .spin-button{

        margin-top:7px;

        padding:7px;

        font-size:14px;
    }


    .wheel-area{

        width:
            min(
                72vh,
                44vw
            );
    }


    .center-logo{

        width:80px;
        height:80px;
    }


    .prize img{

        width:58px;
        height:58px;

        top:-58px;
    }


    .lucky-text{

        font-size:15px;

        top:-53px;
    }


    .result-box{

        width:160px;

        min-height:150px;
    }


    .footer{

        font-size:8px;
    }
}

</style>

</head>

/*

   F10 = حظ أوفر
*/

    {
        id:1,
        name:"حظ أوفر",
        image:null,
        lucky:true
    },

    {
        id:2,
        name:"الجائزة رقم 2",
        image:"F_2.JPG",
        lucky:false
    },

    {
        id:3,
        name:"الجائزة رقم 3",
        image:"F_3.JPG",
        lucky:false
    },

    {
        id:4,
        name:"الجائزة رقم 4",
        image:"F_4.JPG",
        lucky:false
    },

    {
        id:5,
        name:"الجائزة رقم 5",
        image:"F_5.JPG",
        lucky:false
    },

    {
        id:6,
        name:"الجائزة رقم 6",
        image:"F_6.JPG",
        lucky:false
    },

    {

        image:null,
        lucky:true
    },

    },

    },

    {

        image:null,
        lucky:true
    }

];


/* =====================================================
   إعدادات الرولة
===================================================== */

const TOTAL_SECTORS = 10;

const SECTOR_ANGLE = 36;


/*
   أرقام الخانات التي بيها حظ أوفر

   0 = F1
   6 = F7
   9 = F10
*/

const LUCKY_SECTORS = [

    0,
    6,
    9

];


/* =====================================================
   التحكم بالسحبات
===================================================== */

/*
   كل 3 جوائز حقيقية
   السحبة الرابعة حظ أوفر.

   يعني:

   1 = جائزة
   2 = جائزة
   3 = جائزة
   4 = حظ أوفر

   5 = جائزة
   6 = جائزة
   7 = جائزة
   8 = حظ أوفر

   وهكذا.
*/

let normalWins = 0;


/* =====================================================
   عدادات الجوائز النادرة
===================================================== */

/*
   F3 تقريباً كل 20 سحبة عادية.
*/

let drawsSinceF3 = 0;


/*
   F5 تقريباً كل 15 سحبة عادية.
*/

let drawsSinceF5 = 0;


/* =====================================================
   دوران الرولة
===================================================== */

let currentRotation = 0;

let spinning = false;


/* =====================================================
   اختيار خانة حظ أوفر
===================================================== */

function getLuckySector(){

    const randomIndex =

        Math.floor(
            Math.random() *
            LUCKY_SECTORS.length
        );


    return LUCKY_SECTORS[randomIndex];

}


/* =====================================================
   اختيار جائزة عادية
===================================================== */

function getNormalPrize(){

    /*
       إذا وصلت F3 إلى وقتها
       نخليها تظهر.
    */

    if(drawsSinceF3 >= 20){

        drawsSinceF3 = 0;

        drawsSinceF5++;

        return 2;
        /*
           2 = F3
        */

    }


    /*
       إذا وصلت F5 إلى وقتها
    */

    if(drawsSinceF5 >= 15){

        drawsSinceF5 = 0;

        drawsSinceF3++;

        return 4;
        /*
           4 = F5
        */

    }


    /*
       الجوائز الطبيعية:

       F2
       F4
       F6
       F8
       F9

       و F3 / F5 حسب العدادات.
    */

    const normalSectors = [

        1,  // F2
        3,  // F4
        5,  // F6
        7,  // F8
        8   // F9

    ];


    /*
       نخلي F3 و F5 ممكن تظهر
       قبل موعدها لكن باحتمال قليل جداً.
    */

    const random =
        Math.random();


    if(random < 0.05){

        drawsSinceF3 = 0;

        drawsSinceF5++;

        return 2;

        /*
           F3
        */

    }


    if(random < 0.10){

        drawsSinceF5 = 0;

        drawsSinceF3++;

        return 4;

        /*
           F5
        */

    }


    /*
       جائزة عادية
    */

    const randomIndex =

        Math.floor(
            Math.random() *
            normalSectors.length
        );


    drawsSinceF3++;

    drawsSinceF5++;


    return normalSectors[randomIndex];

}


/* =====================================================
   اختيار النتيجة
===================================================== */

function chooseResult(){

    /*
       كل 3 جوائز
       بعدها حظ أوفر.
    */

    if(normalWins >= 3){

        normalWins = 0;


        return getLuckySector();

    }


    /*
       جائزة حقيقية
    */

    normalWins++;


    return getNormalPrize();

}


/* =====================================================
   تحريك الرولة
===================================================== */

function spinWheel(){

    if(spinning){

        return;
    }


    spinning = true;


    const wheel =
        document.getElementById(
            "wheel"
        );


    const button =
        document.getElementById(
            "spinButton"
        );


    const result =
        document.getElementById(
            "result"
        );


    const wheelArea =
        document.getElementById(
            "wheelArea"
        );


    button.disabled = true;


    /*
       أثناء الدوران
    */

    result.innerHTML = `

        <div
            style="
                color:#1688ff;
                font-size:20px;
                font-weight:900;
            "
        >
            الرولة تدور...
        </div>

    `;


    /*
       نحدد الخانة أولاً
    */

    const selected =
        chooseResult();


    /*
       منتصف الخانة

       كل خانة = 36 درجة

       18 درجة = منتصف الخانة
    */

    const target =
        selected *
        SECTOR_ANGLE +
        18;


    /*
       7 دورات كاملة
    */

    const extra =
        360 * 7;


    /*
       الدوران النهائي

       مهم جداً:

       هذا الحساب هو الذي يخلي
       النتيجة تطابق الخانة.
    */

    const finalRotation =

        currentRotation +

        extra +

        (360 - target);


    currentRotation =
        finalRotation;


    /*
       تحريك الرولة
    */

    wheel.style.transform =

        `rotate(${finalRotation}deg)`;


    /*
       بعد انتهاء الدوران
    */

    setTimeout(

        function(){

            /*
               نجيب نفس الخانة
               التي اختارها النظام
            */

            const prize =
                prizes[selected];


            /* =========================================
               حظ أوفر
            ========================================= */

            if(prize.lucky){

                result.innerHTML = `

                    <div
                        class="lucky-result"
                    >
                        حظ أوفر
                    </div>

                `;

            }


            /* =========================================
               جائزة حقيقية
            ========================================= */

            else{

                result.innerHTML = `

                    <img
                        src="${prize.image}"
                        alt="${prize.name}"
                    >

                    <div
                        style="
                            color:#1688ff;
                            font-size:22px;
                            font-weight:900;
                        "
                    >
                        🎉 مبروك!
                    </div>

                    <div
                        style="
                            color:#fff;
                            font-size:18px;
                            font-weight:bold;
                            margin-top:5px;
                        "
                    >
                        ${prize.name}
                    </div>

                `;

            }


            /*
               تأثير الفوز
            */

            wheelArea.classList.add(
                "winner"
            );


            setTimeout(

                function(){

                    wheelArea.classList.remove(
                        "winner"
                    );

                },

                700

            );


            /*
               إعادة تفعيل الزر
            */

            spinning = false;

            button.disabled = false;

        },

        5600

    );

}
