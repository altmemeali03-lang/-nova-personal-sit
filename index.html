<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فؤاد فون | اضغط واربح</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:#050505;
    color:#fff;
}


/* =====================================================
   PAGE
===================================================== */

.page{
    width:100vw;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            #111827 0%,
            #070b12 45%,
            #020304 100%
        );
}


/* =====================================================
   FRAME
===================================================== */

.frame{
    position:relative;

    width:96vw;
    height:94vh;

    max-width:1550px;

    background:
        linear-gradient(
            135deg,
            #05080d,
            #090d14 50%,
            #030507
        );

    border:2px solid #183a62;

    box-shadow:
        0 0 0 3px #020304,
        0 0 45px rgba(0,100,255,.28);

    overflow:hidden;
}


/* =====================================================
   INNER FRAME
===================================================== */

.frame:before{
    content:"";

    position:absolute;

    inset:12px;

    border:1px solid #21466f;

    pointer-events:none;

    z-index:30;
}


/* =====================================================
   CORNERS
===================================================== */

.corner{
    position:absolute;

    width:130px;
    height:5px;

    background:#087cff;

    box-shadow:
        0 0 12px #087cff;

    z-index:40;
}

.c1{
    top:22px;
    left:28px;
}

.c2{
    top:22px;
    right:28px;
}

.c3{
    bottom:22px;
    left:28px;
}

.c4{
    bottom:22px;
    right:28px;
}


.corner-v{
    position:absolute;

    width:5px;
    height:90px;

    background:#087cff;

    box-shadow:
        0 0 12px #087cff;

    z-index:40;
}

.cv1{
    top:22px;
    left:28px;
}

.cv2{
    top:22px;
    right:28px;
}

.cv3{
    bottom:22px;
    left:28px;
}

.cv4{
    bottom:22px;
    right:28px;
}


/* =====================================================
   CONTENT
===================================================== */

.content{
    position:relative;

    width:100%;
    height:100%;

    z-index:10;

    display:grid;

    grid-template-columns:
        280px
        minmax(500px,1fr)
        240px;

    align-items:center;

    gap:15px;

    padding:45px 60px;
}


/* =====================================================
   LEFT
===================================================== */

.left{
    height:100%;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;
}


/* =====================================================
   LOGO
===================================================== */

.top-logo{
    width:75px;
    height:75px;

    object-fit:contain;

    margin-bottom:10px;
}


/* =====================================================
   TITLE
===================================================== */

.title{
    font-size:52px;

    font-weight:900;

    color:#fff;

    text-shadow:
        0 4px 15px #000;
}

.red-line{
    width:80px;
    height:4px;

    margin:12px auto;

    background:#087cff;

    box-shadow:
        0 0 12px #087cff;
}

.subtitle{
    font-size:19px;

    font-weight:bold;

    line-height:1.7;
}

.red{
    color:#087cff;
}

.exclusive{
    margin-top:5px;

    color:#ddd;

    font-size:15px;

    line-height:1.7;
}


/* =====================================================
   BUTTON
===================================================== */

.spin-button{

    margin-top:30px;

    width:210px;

    padding:15px;

    border:none;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #087cff,
            #034c9b
        );

    color:#fff;

    font-family:inherit;

    font-size:21px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 8px 25px rgba(0,110,255,.35);

    transition:.2s;
}

.spin-button:hover{

    transform:translateY(-3px);

    box-shadow:
        0 12px 35px rgba(0,110,255,.55);
}

.spin-button:active{

    transform:scale(.95);
}

.spin-button:disabled{

    opacity:.5;

    cursor:not-allowed;
}


/* =====================================================
   CENTER
===================================================== */

.center{

    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;
}


/* =====================================================
   WHEEL AREA
===================================================== */

.wheel-area{

    position:relative;

    width:min(48vw,600px);

    aspect-ratio:1;
}


/* =====================================================
   POINTER
===================================================== */

.pointer{

    position:absolute;

    z-index:100;

    top:-4px;

    left:50%;

    transform:
        translateX(-50%);

    width:0;
    height:0;

    border-left:25px solid transparent;
    border-right:25px solid transparent;

    border-top:65px solid #087cff;

    filter:
        drop-shadow(
            0 4px 5px #000
        );
}

.pointer:after{

    content:"";

    position:absolute;

    left:-10px;

    top:-58px;

    width:20px;
    height:20px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 0 4px #111;
}


/* =====================================================
   WHEEL GLOW
===================================================== */

.wheel-glow{

    position:absolute;

    inset:-12px;

    border-radius:50%;

    border:4px solid #087cff;

    box-shadow:

        0 0 10px #087cff,
        0 0 25px rgba(0,110,255,.8),
        0 0 55px rgba(0,110,255,.35);

    pointer-events:none;

    z-index:20;
}


/* =====================================================
   WHEEL
===================================================== */

.wheel{

    position:absolute;

    inset:0;

    border-radius:50%;

    overflow:hidden;

    border:
        8px solid #080808;

    background:#111;

    box-shadow:

        0 0 0 3px #777,
        0 15px 40px #000;

    transition:
        transform
        5.5s
        cubic-bezier(.12,.75,.12,1);

    z-index:5;
}


/* =====================================================
   SECTORS
   أزرق + أصفر بالتناوب
===================================================== */

.sectors{

    position:absolute;

    inset:0;

    border-radius:50%;

    background:

        conic-gradient(

            from -18deg,

            #ffd900 0deg 36deg,
            #087cff 36deg 72deg,

            #ffd900 72deg 108deg,
            #087cff 108deg 144deg,

            #ffd900 144deg 180deg,
            #087cff 180deg 216deg,

            #ffd900 216deg 252deg,
            #087cff 252deg 288deg,

            #ffd900 288deg 324deg,
            #087cff 324deg 360deg
        );
}


/* =====================================================
   SECTOR LINES
===================================================== */

.sector-lines{

    position:absolute;

    inset:0;

    border-radius:50%;

    background:

        repeating-conic-gradient(

            from -18deg,

            transparent 0deg 35deg,

            rgba(255,255,255,.8) 35deg 36deg
        );

    z-index:2;
}


/* =====================================================
   PRIZE
===================================================== */

.prize{

    position:absolute;

    width:36%;
    height:36%;

    left:32%;
    top:32%;

    z-index:8;

    transform-origin:center;
}


/* =====================================================
   PRODUCT IMAGE
   مرفوعة إلى نهاية الخانة
===================================================== */

.prize img{

    position:absolute;

    width:105px;
    height:105px;

    max-width:none;

    object-fit:contain;

    left:50%;

    /*
       رفع الصورة للأعلى
       بحيث تصير قريبة جداً من نهاية الخانة
    */

    top:-125px;

    transform:
        translateX(-50%);

    filter:
        drop-shadow(
            0 5px 7px rgba(0,0,0,.95)
        );

    background:transparent;

    border-radius:10px;
}


/* =====================================================
   LUCK TEXT
===================================================== */

.luck-text{

    position:absolute;

    left:50%;
    top:-112px;

    transform:
        translateX(-50%);

    width:170px;

    text-align:center;

    color:#111;

    font-size:22px;

    font-weight:900;

    white-space:nowrap;

    text-shadow:none;

    pointer-events:none;
}


/* =====================================================
   POSITIONS
===================================================== */

.p1{
    transform:rotate(0deg);
}

.p2{
    transform:rotate(36deg);
}

.p3{
    transform:rotate(72deg);
}

.p4{
    transform:rotate(108deg);
}

.p5{
    transform:rotate(144deg);
}

.p6{
    transform:rotate(180deg);
}

.p7{
    transform:rotate(216deg);
}

.p8{
    transform:rotate(252deg);
}

.p9{
    transform:rotate(288deg);
}

.p10{
    transform:rotate(324deg);
}


/* =====================================================
   CENTER LOGO
===================================================== */

.center-logo{

    position:absolute;

    z-index:50;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:145px;
    height:145px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #202020,
            #050505
        );

    border:
        5px solid #087cff;

    box-shadow:

        0 0 0 5px #050505,
        0 0 25px rgba(0,110,255,.8);

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.center-logo img{

    width:88%;
    height:88%;

    object-fit:contain;
}


/* =====================================================
   RIGHT
===================================================== */

.right{

    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;
}


/* =====================================================
   RESULT BOX
===================================================== */

.result-box{

    width:220px;

    min-height:270px;

    padding:20px 18px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            #111820,
            #05080c
        );

    border:
        1px solid #24476d;

    border-top:
        4px solid #087cff;

    box-shadow:
        0 10px 35px rgba(0,0,0,.6);
}


/* =====================================================
   RESULT IMAGE
===================================================== */

.result-image{

    width:105px;

    height:105px;

    object-fit:contain;

    margin-bottom:10px;

    display:none;

    filter:
        drop-shadow(
            0 5px 8px rgba(0,0,0,.8)
        );
}


/* =====================================================
   RESULT LUCK
===================================================== */

.result-luck{

    display:none;

    font-size:30px;

    font-weight:900;

    color:#ffd900;

    margin-bottom:15px;
}


/* =====================================================
   RESULT TITLE
===================================================== */

.result-title{

    color:#aaa;

    font-size:15px;

    margin-bottom:10px;
}


/* =====================================================
   RESULT
===================================================== */

.result{

    color:#087cff;

    font-size:24px;

    font-weight:900;

    line-height:1.5;
}


/* =====================================================
   HELP
===================================================== */

.help{

    margin-top:15px;

    color:#bbb;

    font-size:12px;

    line-height:1.7;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    position:absolute;

    z-index:60;

    bottom:17px;

    left:50%;

    transform:
        translateX(-50%);

    white-space:nowrap;

    font-size:12px;

    color:#ccc;
}

.footer span{

    color:#087cff;

    font-weight:bold;
}


/* =====================================================
   WIN ANIMATION
===================================================== */

.winner{

    animation:
        winner .7s ease;
}

@keyframes winner{

    0%{
        transform:scale(1);
    }

    40%{
        transform:scale(1.03);
    }

    70%{
        transform:scale(.98);
    }

    100%{
        transform:scale(1);
    }
}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:1150px){

    .content{

        grid-template-columns:
            230px
            minmax(430px,1fr)
            190px;

        padding:
            40px 45px;
    }

    .title{
        font-size:42px;
    }

    .subtitle{
        font-size:15px;
    }

    .exclusive{
        font-size:13px;
    }

    .wheel-area{
        width:min(47vw,500px);
    }

    .prize img{

        width:88px;
        height:88px;

    }

    .luck-text{

        top:-95px;

        font-size:18px;
    }

    .center-logo{

        width:120px;
        height:120px;
    }

    .result-box{

        width:180px;
        min-height:220px;
    }

    .result-image{

        width:80px;
        height:80px;
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .frame{

        width:100vw;
        height:100vh;

        border:none;
    }

    .content{

        display:flex;

        flex-direction:column;

        padding:
            18px 20px 10px;

        gap:0;
    }

    .left{

        height:auto;

        flex-shrink:0;
    }

    .top-logo{

        width:40px;
        height:40px;

        margin-bottom:2px;
    }

    .title{
        font-size:27px;
    }

    .red-line{

        width:55px;
        height:3px;

        margin:5px auto;
    }

    .subtitle{

        font-size:11px;

        line-height:1.5;
    }

    .exclusive{

        font-size:9px;

        margin-top:1px;
    }

    .spin-button{

        margin-top:8px;

        width:170px;

        padding:8px;

        font-size:16px;
    }

    .center{

        width:100%;

        flex:1;

        min-height:0;
    }

    .wheel-area{

        width:
            min(
                68vh,
                88vw
            );
    }

    .prize img{

        width:
            clamp(
                55px,
                14vw,
                82px
            );

        height:
            clamp(
                55px,
                14vw,
                82px
            );

        top:
            clamp(
                -85px,
                -18vw,
                -65px
            );
    }

    .luck-text{

        top:
            clamp(
                -72px,
                -16vw,
                -58px
            );

        width:120px;

        font-size:15px;
    }

    .center-logo{

        width:82px;
        height:82px;

        border-width:4px;
    }

    .right{
        display:none;
    }

    .footer{

        bottom:7px;

        font-size:8px;
    }

    .corner{

        width:70px;
        height:3px;
    }

    .corner-v{

        width:3px;
        height:50px;
    }
}


/* =====================================================
   SHORT MOBILE
===================================================== */

@media(
    max-width:700px
) and (
    max-height:650px
){

    .content{
        padding-top:10px;
    }

    .top-logo{

        width:30px;
        height:30px;
    }

    .title{
        font-size:22px;
    }

    .subtitle{
        font-size:9px;
    }

    .exclusive{
        font-size:8px;
    }

    .spin-button{

        margin-top:4px;

        padding:5px;

        font-size:13px;
    }

    .wheel-area{

        width:
            min(
                60vh,
                80vw
            );
    }

    .center-logo{

        width:68px;
        height:68px;
    }

    .prize img{

        width:48px;
        height:48px;

        top:-60px;
    }

    .luck-text{

        top:-52px;

        font-size:12px;
    }
}


/* =====================================================
   LANDSCAPE MOBILE
===================================================== */

@media(
    max-height:550px
) and (
    orientation:landscape
){

    .content{

        display:grid;

        grid-template-columns:
            220px
            1fr
            180px;

        padding:
            25px 45px;
    }

    .title{
        font-size:28px;
    }

    .subtitle{
        font-size:11px;
    }

    .exclusive{
        font-size:9px;
    }

    .spin-button{

        margin-top:7px;

        padding:7px;

        font-size:14px;
    }

    .wheel-area{

        width:
            min(
                72vh,
                44vw
            );
    }

    .center-logo{

        width:80px;
        height:80px;
    }

    .prize img{

        width:55px;
        height:55px;

        top:-65px;
    }

    .luck-text{

        top:-57px;

        font-size:13px;
    }

    .result-box{

        width:160px;

        min-height:150px;
    }

    .footer{
        font-size:8px;
    }
}

</style>

</head>

/* =====================================================
   VARIABLES
===================================================== */

let currentRotation = 0;

let spinning = false;

let spinCount = 0;


/*
   آخر مرة طلعت بها الجوائز النادرة
*/

let lastF1 = 0;
let lastF3 = 0;
let lastF5 = 0;


/* =====================================================
   CHOOSE PRODUCT
===================================================== */

function chooseProduct(){

    const currentSpin = spinCount;


    /*
       F3:
       تقريباً كل 20 سحبة
    */

    if(
        currentSpin - lastF3 >= 20
    ){

        lastF3 = currentSpin;

        return 2;
    }


    /*
       F5:
       تقريباً كل 15 سحبة
    */

    if(
        currentSpin - lastF5 >= 15
    ){

        lastF5 = currentSpin;

        return 4;
    }


    /*
       F1:
       تقريباً كل 10 سحبات
    */

    if(
        currentSpin - lastF1 >= 10
    ){

        lastF1 = currentSpin;

        return 0;
    }


    /*
       باقي الجوائز الطبيعية
    */

    const normalProducts = [

        0,  // F1
        1,  // F2
        3,  // F4
        5,  // F6
        6   // F8

    ];


    /*
       نخلي F2 و F4 و F6 و F8
       هي الأكثر ظهوراً
    */

    const randomIndex =
        Math.floor(
            Math.random() *
            normalProducts.length
        );


    return normalProducts[randomIndex];

}


/* =====================================================
   SPIN
===================================================== */

function spinWheel(){

    if(spinning){

        return;
    }


    spinning = true;

    spinCount++;


    const wheel =
        document.getElementById("wheel");


    const button =
        document.getElementById("spinButton");


    const result =
        document.getElementById("result");


    const resultImage =
        document.getElementById("resultImage");


    const resultLuck =
        document.getElementById("resultLuck");


    const wheelArea =
        document.getElementById("wheelArea");


    button.disabled = true;


    /*
       نخفي النتيجة القديمة
    */

    resultImage.style.display = "none";

    resultLuck.style.display = "none";


    result.innerHTML =
        "الرولة تدور...";


    /*
       =================================================
       كل 3 نتائج = حظ أوفر
       =================================================
    */

    let selected;


    if(
        spinCount % 3 === 0
    ){

        /*
           نختار واحدة من خانات
           حظ أوفر الثلاثة
        */

        const luckSectors = [

            7,
            8,
            9

        ];


        selected =
            luckSectors[
                Math.floor(
                    Math.random() *
                    luckSectors.length
                )
            ];

    }

    else{

        /*
           اختيار جائزة
        */

        selected =
            chooseProduct();

    }


    /*
       =================================================
       تحديد مركز الخانة
       =================================================
    */

    const sector = 36;

    const target =
        selected * sector + 18;


    /*
       7 دورات كاملة
    */

    const extra =
        360 * 7;


    /*
       الدوران يعتمد على
       آخر مكان وصلت له الرولة
    */

    const finalRotation =
        currentRotation +
        extra +
        (360 - target);


    currentRotation =
        finalRotation;


    /*
       تشغيل الرولة
    */

    wheel.style.transform =
        `rotate(${finalRotation}deg)`;


    /*
       =================================================
       بعد انتهاء الدوران
       =================================================
    */

    setTimeout(function(){

        const prize =
            prizes[selected];


        /*
           =============================================
           إذا حظ أوفر
           =============================================
        */

        if(
            prize.type === "luck"
        ){

            resultImage.style.display =
                "none";


            resultLuck.style.display =
                "block";


            result.innerHTML =
                "حظ أوفر";


        }


        /*
           =============================================
           إذا جائزة
           =============================================
        */

        else{

            resultLuck.style.display =
                "none";


            resultImage.src =
                prize.image;


            resultImage.style.display =
                "block";


            result.innerHTML =
                "🎉 مبروك!<br>" +
                prize.name;

        }


        /*
           حركة الفوز
        */

        wheelArea.classList.add(
            "winner"
        );


        setTimeout(function(){

            wheelArea.classList.remove(
                "winner"
            );

        },700);


        spinning = false;

        button.disabled = false;


    },5600);

}
