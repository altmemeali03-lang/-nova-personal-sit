<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فؤاد فون | اضغط واربح</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        "Tajawal",
        "Cairo",
        Tahoma,
        Arial,
        sans-serif;

    background:#03070d;
    color:#fff;
}


/* =====================================================
   PAGE
===================================================== */

.page{
    width:100vw;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            #071426 0%,
            #03070d 55%,
            #010204 100%
        );
}


/* =====================================================
   FRAME
===================================================== */

.frame{
    position:relative;

    width:96vw;
    height:94vh;

    max-width:1550px;

    background:
        linear-gradient(
            135deg,
            #05080d,
            #020305 50%,
            #06101c
        );

    border:2px solid #18334f;

    box-shadow:
        0 0 0 3px #010204,
        0 0 45px rgba(0,90,180,.25);

    overflow:hidden;
}


/* =====================================================
   INNER FRAME
===================================================== */

.frame:before{
    content:"";

    position:absolute;

    inset:12px;

    border:1px solid #17334d;

    pointer-events:none;

    z-index:30;
}


/* =====================================================
   CORNERS
===================================================== */

.corner{
    position:absolute;

    width:130px;
    height:5px;

    background:#087cff;

    box-shadow:
        0 0 12px #087cff;

    z-index:40;
}

.c1{
    top:22px;
    left:28px;
}

.c2{
    top:22px;
    right:28px;
}

.c3{
    bottom:22px;
    left:28px;
}

.c4{
    bottom:22px;
    right:28px;
}


.corner-v{
    position:absolute;

    width:5px;
    height:90px;

    background:#087cff;

    box-shadow:
        0 0 12px #087cff;

    z-index:40;
}

.cv1{
    top:22px;
    left:28px;
}

.cv2{
    top:22px;
    right:28px;
}

.cv3{
    bottom:22px;
    left:28px;
}

.cv4{
    bottom:22px;
    right:28px;
}


/* =====================================================
   CONTENT
===================================================== */

.content{
    position:relative;

    width:100%;
    height:100%;

    z-index:10;

    display:grid;

    grid-template-columns:
        280px
        minmax(500px,1fr)
        240px;

    align-items:center;

    gap:15px;

    padding:45px 60px;
}


/* =====================================================
   LEFT
===================================================== */

.left{
    height:100%;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;
}


/* =====================================================
   LOGO
===================================================== */

.top-logo{
    width:75px;
    height:75px;

    object-fit:contain;

    margin-bottom:10px;
}


/* =====================================================
   TITLE
===================================================== */

.title{
    font-size:52px;

    font-weight:900;

    color:#fff;

    text-shadow:
        0 4px 15px #000;
}

.red-line{
    width:80px;
    height:4px;

    margin:12px auto;

    background:#087cff;

    box-shadow:
        0 0 12px #087cff;
}

.subtitle{
    font-size:19px;

    font-weight:bold;

    line-height:1.7;
}

.red{
    color:#1689ff;
}

.exclusive{
    margin-top:5px;

    color:#d8e4ef;

    font-size:15px;

    line-height:1.7;
}


/* =====================================================
   BUTTON
===================================================== */

.spin-button{
    margin-top:30px;

    width:210px;

    padding:15px;

    border:none;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #0d7cff,
            #063c78
        );

    color:#fff;

    font-family:inherit;

    font-size:21px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 8px 25px rgba(0,100,255,.35);

    transition:.2s;
}

.spin-button:hover{
    transform:translateY(-3px);

    box-shadow:
        0 12px 35px rgba(0,120,255,.55);
}

.spin-button:active{
    transform:scale(.95);
}

.spin-button:disabled{
    opacity:.5;
    cursor:not-allowed;
}


/* =====================================================
   CENTER
===================================================== */

.center{
    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;
}


/* =====================================================
   WHEEL AREA
===================================================== */

.wheel-area{
    position:relative;

    width:min(48vw,600px);

    aspect-ratio:1;
}


/* =====================================================
   POINTER
===================================================== */

.pointer{
    position:absolute;

    z-index:100;

    top:-5px;
    left:50%;

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:25px solid transparent;
    border-right:25px solid transparent;

    border-top:65px solid #087cff;

    filter:
        drop-shadow(
            0 4px 5px #000
        );
}

.pointer:after{
    content:"";

    position:absolute;

    left:-10px;
    top:-58px;

    width:20px;
    height:20px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 0 4px #111;
}


/* =====================================================
   WHEEL GLOW
===================================================== */

.wheel-glow{
    position:absolute;

    inset:-12px;

    border-radius:50%;

    border:4px solid #087cff;

    box-shadow:

        0 0 10px #087cff,
        0 0 25px rgba(0,120,255,.8),
        0 0 55px rgba(0,100,255,.3);

    pointer-events:none;

    z-index:20;
}


/* =====================================================
   WHEEL
===================================================== */

.wheel{
    position:absolute;

    inset:0;

    border-radius:50%;

    overflow:hidden;

    border:
        8px solid #080b0f;

    background:#111;

    box-shadow:

        0 0 0 3px #53606d,
        0 15px 40px #000;

    transition:
        transform
        5.5s
        cubic-bezier(.12,.75,.12,1);

    z-index:5;
}


/* =====================================================
   IMPORTANT
   10 خانات
   كل خانة 36 درجة كاملة
   السهم بالضبط بمنتصف الخانة
===================================================== */

.sectors{
    position:absolute;

    inset:0;

    border-radius:50%;

    /*
       بداية -18 درجة حتى يكون
       السهم بمنتصف أول خانة.

       كل خانة = 36 درجة كاملة.

       أصفر
       أزرق
       أصفر
       أزرق...
    */

    background:
        conic-gradient(
            from -18deg,

            #ffd900 0deg 36deg,
            #1557a6 36deg 72deg,

            #ffd900 72deg 108deg,
            #1557a6 108deg 144deg,

            #ffd900 144deg 180deg,
            #1557a6 180deg 216deg,

            #ffd900 216deg 252deg,
            #1557a6 252deg 288deg,

            #ffd900 288deg 324deg,
            #1557a6 324deg 360deg
        );
}


/* =====================================================
   SECTOR LINES
===================================================== */

.sector-lines{
    position:absolute;

    inset:0;

    border-radius:50%;

    background:
        repeating-conic-gradient(
            from -18deg,

            transparent 0deg 35deg,

            rgba(255,255,255,.8)
            35deg 36deg
        );

    z-index:2;

    pointer-events:none;
}


/* =====================================================
   PRIZES
===================================================== */

.prize{
    position:absolute;

    width:36%;
    height:36%;

    left:32%;
    top:32%;

    z-index:8;

    transform-origin:center;
}


/*
   الصور هنا:
   - أكبر
   - مرفوعة لفوك
   - ومتمركزة بمنتصف الخانة
*/

.prize img{

    position:absolute;

    width:115px;
    height:115px;

    max-width:none;

    object-fit:contain;

    left:50%;
    top:-112px;

    transform:
        translateX(-50%);

    filter:
        drop-shadow(
            0 4px 5px rgba(0,0,0,.85)
        );

    background:transparent;

    border-radius:8px;
}


/* =====================================================
   POSITIONS
===================================================== */

.p1{
    transform:rotate(0deg);
}

.p2{
    transform:rotate(36deg);
}

.p3{
    transform:rotate(72deg);
}

.p4{
    transform:rotate(108deg);
}

.p5{
    transform:rotate(144deg);
}

.p6{
    transform:rotate(180deg);
}

.p7{
    transform:rotate(216deg);
}

.p8{
    transform:rotate(252deg);
}

.p9{
    transform:rotate(288deg);
}

.p10{
    transform:rotate(324deg);
}


/* =====================================================
   حظ أوفر
   بدون صورة
   وبدون ظل
===================================================== */

.loser-text{

    position:absolute;

    left:50%;
    top:-82px;

    transform:
        translateX(-50%);

    width:130px;

    text-align:center;

    color:#111;

    font-size:24px;

    font-weight:900;

    line-height:1.2;

    white-space:nowrap;

    text-shadow:none;

    filter:none;
}


/* =====================================================
   CENTER LOGO
===================================================== */

.center-logo{

    position:absolute;

    z-index:50;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:145px;
    height:145px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #141a22,
            #030508
        );

    border:
        5px solid #087cff;

    box-shadow:

        0 0 0 5px #050505,
        0 0 25px rgba(0,120,255,.8);

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.center-logo img{

    width:88%;
    height:88%;

    object-fit:contain;
}


/* =====================================================
   RIGHT
===================================================== */

.right{

    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;
}


/* =====================================================
   RESULT
===================================================== */

.result-box{

    width:220px;

    min-height:250px;

    padding:20px 18px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            #09121d,
            #03070c
        );

    border:
        1px solid #23415f;

    border-top:
        4px solid #087cff;

    box-shadow:
        0 10px 35px rgba(0,0,0,.6);
}


/* صورة النتيجة */

.result-image{

    width:110px;
    height:110px;

    object-fit:contain;

    margin-bottom:10px;

    display:none;
}


/* حظ أوفر بالنتيجة */

.result-loser{

    color:#ffd900;

    font-size:25px;

    font-weight:900;

    display:none;

    margin-bottom:10px;
}


.result-title{

    color:#9fb2c5;

    font-size:15px;

    margin-bottom:12px;
}


.result{

    color:#1689ff;

    font-size:22px;

    font-weight:900;

    line-height:1.5;
}


.help{

    margin-top:15px;

    color:#9daab7;

    font-size:12px;

    line-height:1.7;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    position:absolute;

    z-index:60;

    bottom:17px;

    left:50%;

    transform:translateX(-50%);

    white-space:nowrap;

    font-size:12px;

    color:#ccc;
}

.footer span{
    color:#1689ff;

    font-weight:bold;
}


/* =====================================================
   WIN ANIMATION
===================================================== */

.winner{
    animation:
        winner .7s ease;
}

@keyframes winner{

    0%{
        transform:scale(1);
    }

    40%{
        transform:scale(1.03);
    }

    70%{
        transform:scale(.98);
    }

    100%{
        transform:scale(1);
    }
}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:1150px){

    .content{

        grid-template-columns:
            230px
            minmax(430px,1fr)
            190px;

        padding:
            40px 45px;
    }

    .title{
        font-size:42px;
    }

    .subtitle{
        font-size:15px;
    }

    .exclusive{

    }

    .loser-text{
        top:-65px;
        font-size:20px;
    }

    .center-logo{
        width:120px;
        height:120px;
    }

    .result-box{
        width:180px;
        min-height:210px;
    }

    .result-image{
        width:90px;
        height:90px;
    }
}


/* =====================================================

===================================================== */

@media(max-width:700px){

    }

    }

    .subtitle{
        font-size:11px;
        line-height:1.5;
    }

    .exclusive{
        font-size:9px;
        margin-top:1px;
    }

    .spin-button{

        margin-top:8px;

        width:170px;

        padding:8px;

        font-size:16px;
    }

    .center{

        width:100%;

        flex:1;

        min-height:0;
    }

    .wheel-area{

        width:
            min(
                68vh,
                88vw
            );
    }


    .prize img{

        width:
            clamp(
                65px,
                15vw,
                90px
            );

        height:
            clamp(
                65px,
                15vw,
                90px
            );

        top:
            clamp(
                -82px,
                -14vw,
                -65px
            );
    }

    .loser-text{

        top:
            clamp(
                -58px,
                -10vw,
                -45px
            );

        font-size:
            clamp(
                15px,
                4vw,
                22px
            );

        width:110px;
    }


    .center-logo{

        width:82px;
        height:82px;

        border-width:4px;
    }


    .right{
        display:none;
    }


    .footer{

        bottom:7px;

        font-size:8px;
    }


    .corner{
        width:70px;
        height:3px;
    }

    .corner-v{
        width:3px;
        height:50px;
    }
}


/* =====================================================
   VERY SHORT MOBILE
===================================================== */

@media(
    max-width:700px
) and (
    max-height:650px
){

    .content{
        padding-top:10px;
    }

    .top-logo{
        width:30px;
        height:30px;
    }

    .title{
        font-size:22px;
    }

    .subtitle{
        font-size:9px;
    }

    .exclusive{
        font-size:8px;
    }

    .spin-button{
        margin-top:4px;
        padding:5px;
        font-size:13px;
    }

    .wheel-area{
        width:
            min(
                60vh,
                80vw
            );
    }

    .center-logo{
        width:68px;
        height:68px;
    }

    .prize img{
        width:52px;
        height:52px;
        top:-54px;
    }

    .loser-text{
        top:-42px;
        font-size:14px;
    }
}


/* =====================================================
   LANDSCAPE MOBILE
===================================================== */

@media(
    max-height:550px
) and (
    orientation:landscape

    .content{

        display:grid;

        grid-template-columns:
            220px
            1fr
            180px;

        padding:
            25px 45px;
    }

    .title{
        font-size:28px;
    }

    .subtitle{
        font-size:11px;
    }

    .exclusive{
        font-size:9px;
    }

    .spin-button{
        margin-top:7px;
        padding:7px;
        font-size:14px;
    }

    .wheel-area{
        width:
            min(
                72vh,
                44vw
            );
    }

    .center-logo{
        width:80px;
        height:80px;
    }

    .prize img{
        width:65px;
        height:65px;
        top:-62px;
    }

    .loser-text{
        top:-47px;
        font-size:16px;
    }

    .result-box{
        width:160px;
        min-height:150px;
    }

    .footer{
        font-size:8px;
    }
}

</style>
</head>

let currentRotation = 0;

let spinning = false;

let spinCount = 0;


/* =====================================================
   اختيار الجائزة
===================================================== */

function choosePrize(){

    spinCount++;


    /*
       F3 كل 20 سحبة
    */

    if(spinCount % 20 === 0){

        return 3;

    }


    /*
       F5 كل 15 سحبة
    */

    if(spinCount % 15 === 0){

        return 5;

    }


    /*
       F1 كل 10 سحبات
    */

    if(spinCount % 10 === 0){

        return 1;

    }


    /*
       باقي السحبات
       نختار من الجوائز الأخرى
    */

    const available = [
        2,
        4,
        6,
        7,
        8,
        9,
        10
    ];


    return available[
        Math.floor(
            Math.random() *
            available.length
        )
    ];

}


/* =====================================================
   SPIN
===================================================== */

function spinWheel(){

    if(spinning){

        return;

    }


    spinning = true;


    const wheel =
        document.getElementById("wheel");


    const button =
        document.getElementById("spinButton");


    const result =
        document.getElementById("result");


    const resultImage =
        document.getElementById("resultImage");


    const resultLoser =
        document.getElementById("resultLoser");


    const wheelArea =
        document.getElementById("wheelArea");


    button.disabled = true;


    result.innerHTML =
        "الرولة تدور...";


    resultImage.style.display =
        "none";


    resultLoser.style.display =
        "none";


    /*
       تحديد الجائزة
    */

    const selectedId =
        choosePrize();


    /*
       index داخل الرولة
    */

    const selectedIndex =
        selectedId - 1;


    /*
       كل خانة 36 درجة
    */

    const sector = 36;


    /*
       لأن الخانات تبدأ من -18
       فمنتصف كل خانة:

       F1 = 0
       F2 = 36
       F3 = 72
       ...
    */

    const target =
        selectedIndex * sector;


    /*
       7 دورات كاملة
    */

    const extra =
        360 * 7;


    /*
       نخلي منتصف الجائزة
       بالضبط مقابل السهم
    */

    const finalRotation =
        currentRotation +
        extra +
        (360 - target);


    currentRotation =
        finalRotation;


    wheel.style.transform =
        `rotate(${finalRotation}deg)`;


    /*
       ننتظر انتهاء الرولة
    */

    setTimeout(function(){

        const prize =
            prizes[selectedIndex];


        /*
           إذا حظ أوفر
        */

        if(prize.image === null){

            resultImage.style.display =
                "none";


            resultLoser.style.display =
                "block";


            result.innerHTML =
                "نتمنى لك حظاً أوفر";

        }


        /*
           إذا جائزة بصورة
        */

        else{

            resultLoser.style.display =
                "none";


            resultImage.src =
                prize.image;


            resultImage.style.display =
                "block";


            result.innerHTML =
                "🎉 مبروك!<br>" +
                prize.name;

        }


        /*
           حركة الفوز
        */

        wheelArea.classList.add(
            "winner"
        );


        setTimeout(function(){

            wheelArea.classList.remove(
                "winner"
            );

        },700);


        spinning = false;

        button.disabled = false;


    },5600);

}


/* =====================================================
   PRELOAD
===================================================== */

window.addEventListener(
    "load",
    function(){

        prizes.forEach(
            function(prize){

                if(prize.image){

                    const image =
                        new Image();

                    image.src =
                        prize.image;

                }

            }
        );

    }
);
