<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فؤاد فون | اضغط واربح</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#f3eadb;
    color:#fff;
}


/* =========================
   MAIN BACKGROUND
========================= */

.page{
    width:100vw;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            #fffaf2 0%,
            #f3eadb 55%,
            #e7d9c5 100%
        );
}


/* =========================
   FRAME
========================= */

.frame{
    position:relative;

    width:96vw;
    height:94vh;

    max-width:1550px;

    background:
        linear-gradient(
            135deg,
            #fffaf2,
            #f0e4d2 48%,
            #fffaf2
        );

    border:2px solid #2b0505;

    box-shadow:
        0 0 0 3px #160000,
        0 0 45px rgba(90,0,0,.25);

    overflow:hidden;
}


/* إطار داخلي */

.frame:before{
    content:"";

    position:absolute;

    inset:12px;

    border:1px solid rgba(80,0,0,.35);

    pointer-events:none;

    z-index:30;
}


/* =========================
   RED CORNERS
========================= */

.corner{
    position:absolute;

    width:130px;
    height:5px;

    background:#700000;

    box-shadow:
        0 0 12px rgba(100,0,0,.7);

    z-index:40;
}

.c1{
    top:22px;
    left:28px;
}

.c2{
    top:22px;
    right:28px;
}

.c3{
    bottom:22px;
    left:28px;
}

.c4{
    bottom:22px;
    right:28px;
}


.corner-v{
    position:absolute;

    width:5px;
    height:90px;

    background:#700000;

    box-shadow:
        0 0 12px rgba(100,0,0,.7);

    z-index:40;
}

.cv1{
    top:22px;
    left:28px;
}

.cv2{
    top:22px;
    right:28px;
}

.cv3{
    bottom:22px;
    left:28px;
}

.cv4{
    bottom:22px;
    right:28px;
}


/* =========================
   CONTENT
========================= */

.content{
    position:relative;

    width:100%;
    height:100%;

    z-index:10;

    display:grid;

    grid-template-columns:
        280px
        minmax(500px,1fr)
        240px;

    align-items:center;

    gap:15px;

    padding:45px 60px;
}


/* =========================
   LEFT
========================= */

.left{
    height:100%;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;
}


/* =========================
   LOGO
========================= */

.top-logo{
    width:75px;
    height:75px;

    object-fit:contain;

    margin-bottom:10px;
}


/* =========================
   TITLE
========================= */

.title{
    font-size:52px;
    font-weight:900;

    color:#260000;

    text-shadow:
        0 2px 5px rgba(0,0,0,.15);
}

.red-line{
    width:80px;
    height:4px;

    margin:12px auto;

    background:#650000;

    box-shadow:
        0 0 12px rgba(100,0,0,.5);
}

.subtitle{
    font-size:19px;
    font-weight:bold;

    line-height:1.7;

    color:#260000;
}

.red{
    color:#650000;
}

.exclusive{
    margin-top:5px;

    color:#4a3333;

    font-size:15px;

    line-height:1.7;
}


/* =========================
   BUTTON
========================= */

.spin-button{
    margin-top:30px;

    width:210px;

    padding:15px;

    border:none;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #720000,
            #3d0000
        );

    color:white;

    font-family:inherit;

    font-size:21px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 8px 25px rgba(80,0,0,.35);

    transition:.2s;
}

.spin-button:hover{
    transform:translateY(-3px);

    box-shadow:
        0 12px 35px rgba(80,0,0,.5);
}

.spin-button:active{
    transform:scale(.95);
}

.spin-button:disabled{
    opacity:.5;
    cursor:not-allowed;
}


/* السهم محذوف نهائياً */


/* =========================
   CENTER
========================= */

.center{
    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;
}


/* =========================
   WHEEL AREA
========================= */

.wheel-area{
    position:relative;

    width:min(48vw,600px);

    aspect-ratio:1;
}


/* =========================
   POINTER
========================= */

.pointer{
    position:absolute;

    z-index:100;

    top:-4px;
    left:50%;

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:25px solid transparent;
    border-right:25px solid transparent;

    border-top:65px solid #650000;

    filter:
        drop-shadow(
            0 4px 5px #000
        );
}

.pointer:after{
    content:"";

    position:absolute;

    left:-10px;
    top:-58px;

    width:20px;
    height:20px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 0 4px #111;
}


/* =========================
   OUTER GLOW
========================= */

.wheel-glow{
    position:absolute;

    inset:-12px;

    border-radius:50%;

    border:4px solid #650000;

    box-shadow:

        0 0 10px rgba(100,0,0,.7),
        0 0 25px rgba(100,0,0,.5),
        0 0 55px rgba(100,0,0,.25);

    pointer-events:none;

    z-index:20;
}


/* =========================
   WHEEL
========================= */

.wheel{
    position:absolute;

    inset:0;

    border-radius:50%;

    overflow:hidden;

    border:
        8px solid #080808;

    background:#111;

    box-shadow:

        0 0 0 3px #777,
        0 15px 40px rgba(0,0,0,.7);

    transition:
        transform
        5.5s
        cubic-bezier(.12,.75,.12,1);

    z-index:5;
}


/* =========================
   10 SECTORS
========================= */

.sectors{
    position:absolute;

    inset:0;

    border-radius:50%;

    background:
        conic-gradient(
            #650000 0deg 36deg,
            #111111 36deg 72deg,

            #650000 72deg 108deg,
            #111111 108deg 144deg,

            #650000 144deg 180deg,
            #111111 180deg 216deg,

            #650000 216deg 252deg,
            #111111 252deg 288deg,

            #650000 288deg 324deg,
            #111111 324deg 360deg
        );
}


/* =========================
   SECTOR LINES
========================= */

.sector-lines{
    position:absolute;

    inset:0;

    border-radius:50%;

    background:
        repeating-conic-gradient(
            from 0deg,
            transparent 0deg 35deg,
            rgba(255,255,255,.7) 35deg 36deg
        );

    z-index:2;
}


/* =========================
   PRIZE IMAGES
========================= */

.prize{
    position:absolute;

    width:36%;
    height:36%;

    left:32%;
    top:32%;

    z-index:8;

    transform-origin:center;
}


/*
   كل صورة موجودة بزاوية
   ثابتة 36 درجة
*/

.prize img{

    position:absolute;

    width:105px;
    height:105px;

    max-width:100%;

    object-fit:contain;

    left:50%;
    top:-88px;

    transform:
        translateX(-50%);

    filter:
        drop-shadow(
            0 5px 7px rgba(0,0,0,.95)
        );

    background:transparent;

    border-radius:10px;
}


/* =========================
   POSITIONS
========================= */

.p1{
    transform:rotate(0deg);
}

.p2{
    transform:rotate(36deg);
}

.p3{
    transform:rotate(72deg);
}

.p4{
    transform:rotate(108deg);
}

.p5{
    transform:rotate(144deg);
}

.p6{
    transform:rotate(180deg);
}

.p7{
    transform:rotate(216deg);
}

.p8{
    transform:rotate(252deg);
}

.p9{
    transform:rotate(288deg);
}

.p10{
    transform:rotate(324deg);
}


/* =========================
   CENTER LOGO
========================= */

.center-logo{

    position:absolute;

    z-index:50;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:145px;
    height:145px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #242424,
            #080808
        );

    border:
        5px solid #650000;

    box-shadow:

        0 0 0 5px #050505,
        0 0 25px rgba(100,0,0,.7);

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.center-logo img{

    width:88%;
    height:88%;

    object-fit:contain;
}


/* =========================
   RIGHT
========================= */

.right{

    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;
}


/* =========================
   RESULT BOX
========================= */

.result-box{

    width:220px;

    min-height:250px;

    padding:20px 18px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            #fffaf2,
            #eee0cd
        );

    border:
        2px solid #4a0000;

    border-top:
        5px solid #650000;

    box-shadow:
        0 10px 35px rgba(60,0,0,.25);

    border-radius:8px;
}


/* صورة النتيجة */

.result-image{

    width:105px;
    height:105px;

    object-fit:contain;

    margin-bottom:10px;

    display:none;

    filter:
        drop-shadow(
            0 5px 8px rgba(0,0,0,.35)
        );
}


/* أيقونة البداية */

.gift{
    font-size:55px;
    margin-bottom:12px;
}


/* عنوان النتيجة */

.result-title{

    color:#4b3030;

    font-size:15px;

    margin-bottom:10px;
}


/* النتيجة */

.result{

    color:#650000;

    font-size:23px;

    font-weight:900;

    line-height:1.5;
}


/* النص السفلي */

.help{

    margin-top:12px;

    color:#6b5555;

    font-size:12px;

    line-height:1.7;
}


/* =========================
   FOOTER
========================= */

.footer{

    position:absolute;

    z-index:60;

    bottom:17px;

    left:50%;

    transform:translateX(-50%);

    white-space:nowrap;

    font-size:12px;

    color:#4a3030;
}

.footer span{
    color:#650000;
    font-weight:bold;
}


/* =========================
   WIN
========================= */

.winner{
    animation:
        winner .7s ease;
}

@keyframes winner{

    0%{
        transform:scale(1);
    }

    40%{
        transform:scale(1.03);
    }

    70%{
        transform:scale(.98);
    }

    100%{
        transform:scale(1);
    }
}


/* =========================
   TABLET
========================= */

@media(max-width:1150px){

    .content{

        grid-template-columns:
            230px
            minmax(430px,1fr)
            190px;

        padding:
            40px 45px;
    }

    .title{

    }

    .subtitle{
        font-size:15px;
    }

    .exclusive{
        font-size:13px;
    }

    .wheel-area{
        width:min(47vw,500px);
    }

    .prize img{
        width:80px;
        height:80px;
        top:-70px;
    }

    .center-logo{
        width:120px;
        height:120px;
    }

    .result-box{
        width:180px;
        min-height:210px;
    }

    .result-image{
        width:80px;
        height:80px;
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .frame{

        width:100vw;
        height:100vh;

        border:none;
    }

    .content{

        display:flex;

        flex-direction:column;

        padding:
            18px 20px 10px;

        gap:0;
    }


    .left{

        height:auto;

        flex-shrink:0;
    }

    .top-logo{

        width:40px;
        height:40px;

        margin-bottom:2px;
    }

    .title{
        font-size:27px;
    }

    .red-line{
        width:55px;
        height:3px;
        margin:5px auto;
    }

    .subtitle{
        font-size:11px;
        line-height:1.5;
    }

    .exclusive{
        font-size:9px;
        margin-top:1px;
    }


    .spin-button{

        margin-top:8px;

        width:170px;

        padding:8px;

        font-size:16px;
    }


    .center{

        width:100%;

        flex:1;

        min-height:0;
    }

    .wheel-area{

        width:
            min(
                68vh,
                88vw
            );
    }


    .prize img{

        width:
            clamp(
                60px,
                14vw,
                82px
            );

        height:
            clamp(
                60px,
                14vw,
                82px
            );

        top:
            clamp(
                -70px,
                -11vw,
                -58px
            );
    }


    .center-logo{

        width:82px;
        height:82px;

        border-width:4px;
    }


    .right{
        display:none;
    }


    .footer{

        bottom:7px;

        font-size:8px;
    }


    .corner{
        width:70px;
        height:3px;
    }

    .corner-v{
        width:3px;
        height:50px;
    }
}


/* =========================
   VERY SHORT MOBILE
========================= */

@media(
    max-width:700px
) and (
    max-height:650px
){

    .content{
        padding-top:10px;
    }

    .top-logo{
        width:30px;
        height:30px;
    }

    .title{
        font-size:22px;
    }

    .subtitle{
        font-size:9px;
    }

    .exclusive{
        font-size:8px;
    }

    .spin-button{
        margin-top:4px;
        padding:5px;
        font-size:13px;
    }

    .wheel-area{
        width:
            min(
                60vh,
                80vw
            );
    }

    .center-logo{
        width:68px;
        height:68px;
    }

    .prize img{
        width:48px;
        height:48px;
        top:-50px;
    }
}


/* =========================
   LANDSCAPE MOBILE
========================= */

@media(
    max-height:550px
) and (
    orientation:landscape
){

    .content{

        display:grid;

        grid-template-columns:
            220px
            1fr
            180px;

        padding:
            25px 45px;
    }

    .title{
        font-size:28px;
    }

    .subtitle{
        font-size:11px;
    }

    .exclusive{
        font-size:9px;
    }

    .spin-button{
        margin-top:7px;
        padding:7px;
        font-size:14px;
    }

    .wheel-area{
        width:
            min(
                72vh,
                44vw
            );
    }

    .center-logo{
        width:80px;
        height:80px;
    }

    .prize img{
        width:55px;
        height:55px;
        top:-55px;
    }

    .result-box{
        width:160px;
        min-height:170px;
    }

    .result-image{
        width:60px;
        height:60px;
    }

    .footer{
        font-size:8px;
    }
}

</style>
</head>

<script>

/* =========================
   PRIZES
========================= */

const prizeImages = [

    "F_1.JPG",
    "F_2.JPG",
    "F_3.JPG",
    "F_4.JPG",
    "F_5.JPG",
    "F_6.JPG",
    "F_7.JPG",
    "F_8.JPG",
    "F_9.JPG",
    "F_10.JPG"

];


/* أسماء الجوائز */

const prizeNames = [

    "الجائزة رقم 1",
    "الجائزة رقم 2",
    "الجائزة رقم 3",
    "الجائزة رقم 4",
    "الجائزة رقم 5",
    "الجائزة رقم 6",
    "الجائزة رقم 7",
    "الجائزة رقم 8",
    "الجائزة رقم 9",
    "الجائزة رقم 10"

];


let currentRotation = 0;

let spinning = false;


/* =========================
   SPIN
========================= */

function spinWheel(){

    if(spinning){
        return;
    }

    spinning = true;


    const wheel =
        document.getElementById("wheel");

    const button =
        document.getElementById("spinButton");

    const result =
        document.getElementById("result");

    const resultImage =
        document.getElementById("resultImage");

    const giftIcon =
        document.getElementById("giftIcon");

    const wheelArea =
        document.getElementById("wheelArea");


    button.disabled = true;


    result.innerHTML =
        "الرولة تدور...";


    /*
       نخفي صورة النتيجة
       أثناء الدوران
    */

    resultImage.style.display =
        "none";

    giftIcon.style.display =
        "block";


    /*
       اختيار الجائزة
    */

    const selected =
        Math.floor(
            Math.random() *
            prizeImages.length
        );


    /*
       كل صورة تبعد 36 درجة
    */

    const sector =
        360 / prizeImages.length;


    /*
       زاوية الصورة المطلوبة
       بالنسبة للسهم

       مهم جداً:
       الصور عندنا مو في منتصف القطاع
       وإنما على زاوية 0،36،72...
    */

    const desiredAngle =
        selected * sector;


    /*
       نحسب الدوران الإضافي
       حتى الصورة المختارة بالضبط
       تصير تحت السهم.
    */

    const currentMod =
        ((currentRotation % 360) + 360) % 360;


    let correction =
        (360 - desiredAngle - currentMod) % 360;


    /*
       7 دورات كاملة
    */

    const extra =
        360 * 7;


    const finalRotation =
        currentRotation +
        extra +
        correction;


    currentRotation =
        finalRotation;


    /*
       تدوير الرولة
    */

    wheel.style.transform =
        `rotate(${finalRotation}deg)`;


    /*
       بعد انتهاء الدوران
    */

    setTimeout(function(){

        /*
           إظهار نفس الصورة
           الموجودة تحت السهم
        */

        resultImage.src =
            prizeImages[selected];

        resultImage.style.display =
            "block";

        giftIcon.style.display =
            "none";


        /*
           عرض اسم الجائزة
        */

        result.innerHTML =
            "🎉 مبروك!<br>" +
            prizeNames[selected];


        /*
           حركة الفوز
        */

        wheelArea.classList.add(
            "winner"
        );


        setTimeout(function(){

            wheelArea.classList.remove(
                "winner"
            );

        },700);


        spinning = false;

        button.disabled = false;


    },5600);

}


/* =========================
   PRELOAD
========================= */

window.addEventListener(
    "load",
    function(){

        prizeImages.forEach(
            function(src){

                const image =
                    new Image();

                image.src = src;

            }
        );

    }
);

</script>
